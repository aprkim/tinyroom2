<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>TinyRoom - Video Chat</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --radius: 12px;
            --max: 980px;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;

            --bg: #f7f9f8;
            --card: #ffffff;
            --soft: #f0f4f3;
            --border: #e2e8f0;
            --borderSoft: #dbe2ea;

            --text: #1e293b;
            --muted: #64748b;
            --muted2: #9CA3AF;

            --accent: #0EA5A4;
            --accentHover: #0d9488;
            --accentSoft: rgba(14,165,164,.10);
            --accentBorder: rgba(14,165,164,.35);

            --liveBg: #E8F4ED;
            --liveBorder: #A6C5A3;
            --liveText: #324252;

            --disabledBg: #F3F4F6;
            --disabledBorder: #E5E7EB;
            --disabledText: #6B7280;

            --dangerBg: #FEF2F2;
            --dangerBorder: #fca5a5;
            --dangerText: #b91c1c;

            --overlay: rgba(30, 41, 59, 0.5);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #111827;
            --soft: #1f2937;
            --border: #273244;
            --borderSoft: #334155;

            --text: #e5e7eb;
            --muted: #9ca3af;
            --muted2: #6b7280;

            --accent: #0EA5A4;
            --accentHover: #14b8a6;
            --accentSoft: rgba(14,165,164,.18);
            --accentBorder: rgba(14,165,164,.45);

            --liveBg: rgba(16,185,129,.15);
            --liveBorder: rgba(16,185,129,.4);
            --liveText: #a7f3d0;

            --dangerBg: rgba(239,68,68,.15);
            --dangerBorder: rgba(239,68,68,.4);
            --dangerText: #fca5a5;

            --overlay: rgba(0,0,0,0.6);
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            height: 100vh; /* fallback for older browsers */
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
            overflow: hidden;
        }
        @supports (height: 100dvh) {
            body { height: 100dvh; }
        }

        /* Theme Toggle */
        #themeToggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }
        #themeToggle:hover { border-color: var(--accent); }
        #themeToggle svg { width: 18px; height: 18px; }

        /* Topbar */
        .topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .topbar.visible { display: flex; }
        .topbar-left { font-weight: 700; font-size: 15px; color: var(--accent); }
        .topbar-right { display: flex; align-items: center; gap: 8px; }
        .room-code-pill {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accentSoft);
            border: 1px solid var(--accentBorder);
            padding: 4px 10px;
            border-radius: 8px;
        }
        .topbar-btn {
            background: var(--soft);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s;
        }
        .topbar-btn:hover { border-color: var(--accent); color: var(--text); }
        .copied-tooltip {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .copied-tooltip.show { opacity: 1; }

        /* Entry Screen */
        #entryScreen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            gap: 0;
            overflow-y: auto;
        }
        .entry-inner {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .entry-hero {
            text-align: center;
            margin-bottom: 32px;
        }
        .entry-hero h1 {
            font-size: 36px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .entry-hero p {
            font-size: 15px;
            color: var(--muted);
        }
        .beta-pill {
            display: inline-block;
            vertical-align: top;
            background: rgba(14, 165, 164, 0.15);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 8px;
            position: relative;
            top: 4px;
            border: 1px solid rgba(14, 165, 164, 0.25);
        }
        .entry-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 16px;
            font-family: var(--sans);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        [data-theme="light"] .entry-input {
            border-color: rgba(0,0,0,0.22);
            background: rgba(0,0,0,0.02);
        }
        .entry-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,164,0.15);
        }
        .entry-input::placeholder { color: var(--muted2); }
        .entry-input:-webkit-autofill,
        .entry-input:-webkit-autofill:hover,
        .entry-input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
            -webkit-text-fill-color: var(--text);
            transition: background-color 5000s ease-in-out 0s;
        }

        .name-hint {
            font-size: 12px;
            color: var(--dangerText);
            margin-top: 6px;
            padding-left: 18px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 16px;
            text-align: left;
            width: 100%;
        }
        .name-hint.visible { opacity: 1; }

        .entry-cta {
            width: 100%;
            margin-top: 20px;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--muted2);
            font-size: 11px;
            width: 100%;
            opacity: 0.35;
            text-transform: lowercase;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--muted2);
        }

        .join-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .join-row .entry-input { flex: 1; }

        .entry-footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted2);
            opacity: 0.65;
            text-align: center;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
            font-family: var(--sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn-primary {
            padding: 14px 24px;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 12px rgba(14,165,164,0.25);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accentHover);
            box-shadow: 0 4px 16px rgba(14,165,164,0.35);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            color: var(--text);
            border-color: rgba(255,255,255,0.15);
        }
        [data-theme="light"] .btn-secondary {
            background: rgba(0,0,0,0.02);
            border-color: rgba(0,0,0,0.22);
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
        [data-theme="light"] .btn-secondary:hover:not(:disabled) {
            background: rgba(0,0,0,0.04);
        }
        .btn-danger {
            background: var(--dangerBg);
            color: var(--dangerText);
            border-color: var(--dangerBorder);
        }
        .btn-danger:hover { background: var(--dangerBorder); color: #fff; }

        .btn:disabled { cursor: not-allowed; }
        /* Dim only when explicitly marked as "blocked" (not during loading spinner) */
        .btn.btn-blocked:disabled { opacity: 0.45; }
        .btn-full { width: 100%; }
        .join-row .btn { flex: 0 0 auto; min-width: 80px; padding: 14px 20px; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pre-Live Screen */
        #preLiveScreen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .prelive-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: stretch;
            gap: 16px;
            width: 100%;
            max-width: var(--max);
            margin: 0 auto;
        }
        .preview-container {
            width: min(70%, calc((100vh - 180px) * 16 / 9 * 0.7));
            max-width: 100%;
        }
        .prelive-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .prelive-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Live Screen */
        #liveScreen {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }
        .live-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            overflow: hidden;
            width: 100%;
        }

        /* ═══════════════════════════════════════
           CASE 1: No screen share — CSS Grid
           ═══════════════════════════════════════ */
        #screenshareGrid {
            display: none;
        }
        #screenshareGrid.has-shares {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            width: 100%;
        }
        #screenshareGrid .video-tile {
            flex: 1 1 0;
            min-width: 0;
        }

        #cameraGrid {
            display: grid;
            gap: 8px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }
        /* 1 participant: single centered tile */
        .camera-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; place-items: center; }
        .camera-1 .video-tile { width: 100%; max-width: min(100%, calc((100vh - 160px) * 16 / 9)); }
        /* 2 participants: side by side */
        .camera-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        /* 3 participants: top 2, bottom center */
        .camera-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .camera-3 .video-tile:nth-child(3) { grid-column: 1 / -1; max-width: 50%; justify-self: center; }
        /* 4 participants: 2×2 */
        .camera-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        /* 5 participants: top 3, bottom 2 centered */
        .camera-5 { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr 1fr; }
        .camera-5 .video-tile:nth-child(1) { grid-column: 1 / 3; }
        .camera-5 .video-tile:nth-child(2) { grid-column: 3 / 5; }
        .camera-5 .video-tile:nth-child(3) { grid-column: 5 / 7; }
        .camera-5 .video-tile:nth-child(4) { grid-column: 2 / 4; }
        .camera-5 .video-tile:nth-child(5) { grid-column: 4 / 6; }
        /* 6 participants: 3×2 */
        .camera-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
        /* 7 participants: top 4, bottom 3 centered */
        .camera-7 { grid-template-columns: repeat(8, 1fr); grid-template-rows: 1fr 1fr; }
        .camera-7 .video-tile:nth-child(1) { grid-column: 1 / 3; }
        .camera-7 .video-tile:nth-child(2) { grid-column: 3 / 5; }
        .camera-7 .video-tile:nth-child(3) { grid-column: 5 / 7; }
        .camera-7 .video-tile:nth-child(4) { grid-column: 7 / 9; }
        .camera-7 .video-tile:nth-child(5) { grid-column: 1 / 3; }
        .camera-7 .video-tile:nth-child(6) { grid-column: 3 / 6; }
        .camera-7 .video-tile:nth-child(7) { grid-column: 6 / 9; }
        /* 8 participants: 4×2 */
        .camera-8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }

        /* Video Tile */
        .video-tile {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--soft);
            border: 1px solid var(--border);
            transition: transform 0.3s, opacity 0.3s;
        }
        .video-tile[data-is-local="true"] { border: 2px solid var(--accentBorder); }

        .video-tile .aspect-spacer {
            display: block;
            padding-top: 56.25%;
        }

        .video-container {
            position: absolute;
            inset: 0;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .video-container video.visible { display: block; }
        .video-tile[data-is-local="true"][data-stream-type="camera"] .video-container video {
            transform: scaleX(-1);
        }
        /* Screenshare: contain to show full screen, letterbox with dark bg */
        .video-tile[data-stream-type="screenshare"] .video-container video {
            object-fit: contain;
            background: #000;
        }
        .video-container video::-webkit-media-controls { display: none !important; }
        .video-container video::-webkit-media-controls-enclosure { display: none !important; }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--soft);
            color: var(--muted);
        }
        .video-placeholder.hidden { display: none !important; }
        .video-placeholder .initials {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accentSoft);
            border: 2px solid var(--accentBorder);
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(transparent, rgba(0,0,0,.5));
        }
        .member-name {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,.4);
        }
        .member-indicators {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-badge {
            display: none;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--liveBg);
            color: var(--liveText);
            border: 1px solid var(--liveBorder);
        }
        .status-badge.active { display: inline-block; }

        .indicator {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .indicator svg { width: 14px; height: 14px; }
        .indicator.on {
            background: rgba(14,165,164,.7);
            color: #fff;
        }
        .indicator.off {
            background: rgba(185,28,28,.7);
            color: #fff;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .ctrl-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }
        .ctrl-btn:hover { border-color: var(--accent); }
        .ctrl-btn.active { background: var(--accentSoft); border-color: var(--accent); color: var(--accent); }
        .ctrl-btn.off { background: var(--dangerBg); border-color: var(--dangerBorder); color: var(--dangerText); }
        .ctrl-btn.off:hover { background: var(--dangerBorder); color: #fff; }
        .ctrl-btn.danger {
            background: var(--dangerBg);
            border-color: var(--dangerBorder);
            color: var(--dangerText);
            margin-left: 16px;
        }
        .ctrl-btn.danger:hover { background: var(--dangerBorder); color: #fff; }
        .ctrl-btn svg { width: 20px; height: 20px; }

        /* Grid tiles fill their cell */
        #cameraGrid .video-tile {
            width: 100%;
            height: 100%;
        }
        #cameraGrid .video-tile .aspect-spacer { display: none; }
        #cameraGrid .video-tile .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Kicked / Session-ended Modal */
        #kickedOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #kickedOverlay.visible { display: flex; }
        #mobileFullOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #mobileFullOverlay.visible { display: flex; }
        .kicked-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 32px 28px 24px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .kicked-card .btn {
            padding: 10px 32px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: none;
        }
        [data-theme="light"] .kicked-card {
            border-color: rgba(0,0,0,0.08);
        }
        .kicked-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
        }
        .kicked-card p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 24px;
            white-space: pre-line;
        }

        /* Mobile */
        @media (max-width: 640px) {
            /* Topbar compact — single row, no wrap */
            .topbar { padding: 6px 10px; }
            .topbar-left { font-size: 12px; }
            .topbar-right { gap: 4px; }
            .room-code-pill { font-size: 10px; padding: 2px 6px; }
            .topbar-btn { font-size: 10px; padding: 2px 6px; white-space: nowrap; }

            /* Entry screen */
            #entryScreen { padding: 20px 16px; }
            .entry-hero h1 { font-size: 28px; }
            .entry-input { font-size: 16px; } /* prevent iOS zoom on focus */
            .preview-container { width: 95% !important; }

            /* Pre-live controls: wrap if needed */
            .prelive-controls { flex-wrap: wrap; gap: 8px; }
            .prelive-actions { flex-wrap: wrap; gap: 8px; }

            /* Live screen: ensure topbar and controls stay visible */
            #liveScreen { max-height: 100vh; }
            .live-content { padding: 6px; gap: 4px; }

            /* Camera grid on mobile */
            #cameraGrid { gap: 4px; }
            .camera-1 { grid-template-columns: 1fr; }
            /* 2 participants: stack vertically on mobile */
            .camera-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            /* 3 participants: stack vertically */
            .camera-3 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
            .camera-3 .video-tile:nth-child(3) { grid-column: auto; max-width: 100%; justify-self: auto; }
            .camera-4 { grid-template-columns: 1fr 1fr; }
            .camera-5 { grid-template-columns: repeat(2, 1fr); }
            .camera-5 .video-tile:nth-child(1) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(2) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(3) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(4) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(5) { grid-column: 1 / -1; max-width: 50%; justify-self: center; }
            .camera-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
            .camera-7 { grid-template-columns: repeat(2, 1fr); }
            .camera-7 .video-tile { grid-column: auto !important; }
            .camera-7 .video-tile:nth-child(7) { grid-column: 1 / -1 !important; max-width: 50%; justify-self: center; }
            .camera-8 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); }

            /* Screenshare grid */
            #screenshareGrid.has-shares { flex-wrap: wrap; gap: 4px; }
            #screenshareGrid .video-tile { flex: 1 1 100%; }

            /* Smaller tiles: smaller initials */
            .video-placeholder .initials { width: 40px; height: 40px; font-size: 16px; }
            .member-info { padding: 4px 6px; }
            .member-name { font-size: 10px; }
            .status-badge { font-size: 8px; padding: 1px 4px; }
            .indicator { width: 20px; height: 20px; }
            .indicator svg { width: 11px; height: 11px; }

            /* Hide screen share on mobile */
            .hide-on-mobile { display: none !important; }

            /* Controls bar: touch-friendly but compact */
            .ctrl-btn { width: 44px; height: 44px; min-width: 44px; }
            .ctrl-btn svg { width: 18px; height: 18px; }
            .ctrl-btn.danger { margin-left: 8px; }
            .controls-bar { gap: 6px; padding: 8px 12px; flex-wrap: nowrap; }

            /* Video tiles: smaller radius */
            .video-tile { border-radius: 12px; }

            /* Floating tile buttons: bigger touch targets on mobile */
            .video-tile .spotlight-btn { opacity: 0.7; width: 32px; height: 32px; top: 4px; right: 4px; }
            .video-tile .reset-btn { width: 32px; height: 32px; top: 4px; left: 4px; font-size: 16px; }

            /* Toast notifications: fit within 375px screens */
            #toastContainer { max-width: calc(100vw - 32px); }
            .toast { max-width: calc(100vw - 40px); }

            /* Network banner: ensure readability on narrow screens */
            #networkBanner { padding: 6px 12px; font-size: 11px; }

            /* Kicked modal: ensure padding on small screens */
            .kicked-card { padding: 20px 16px 16px; }
        }

        /* Landscape mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .topbar { padding: 4px 12px; }
            .topbar-left { font-size: 12px; }

            .live-content { padding: 4px; gap: 4px; }
            #cameraGrid { gap: 3px; }

            /* Landscape: prefer wide grids */
            .camera-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
            .camera-3 .video-tile:nth-child(3) { grid-column: auto; max-width: none; }
            .camera-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
            .camera-5, .camera-6 { grid-template-columns: repeat(3, 1fr); }
            .camera-5 .video-tile { grid-column: auto !important; }
            .camera-7, .camera-8 { grid-template-columns: repeat(4, 1fr); }
            .camera-7 .video-tile { grid-column: auto !important; }

            .controls-bar { padding: 4px 12px; }
            .ctrl-btn { width: 36px; height: 36px; border-radius: 8px; }
            .ctrl-btn svg { width: 18px; height: 18px; }

            .member-info { padding: 2px 4px; }
            .member-name { font-size: 9px; }
            .video-placeholder .initials { width: 28px; height: 28px; font-size: 12px; }

            .presentation-mode #cameraGrid .video-tile {
                flex: 0 0 90px;
                max-width: 90px;
            }
        }

        /* Spotlight/Fullscreen Mode */
        .video-tile .spotlight-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .video-tile:hover .spotlight-btn { opacity: 1; }
        @media (pointer: coarse) { .video-tile .spotlight-btn { opacity: 0.7; } }
        .spotlight-btn svg { width: 16px; height: 16px; }

        /* CSS fallback spotlight */
        .video-tile.spotlighted {
            position: fixed;
            inset: 0;
            z-index: 999;
            border-radius: 0;
            border: none;
            width: 100% !important;
            max-width: none !important;
        }
        .video-tile.spotlighted .aspect-spacer { display: none; }
        .video-tile.spotlighted .video-container { position: absolute; inset: 0; }
        .video-tile.spotlighted .video-container video { object-fit: contain; background: #000; }

        /* Native fullscreen */
        .video-tile:fullscreen {
            border-radius: 0;
            border: none;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .video-tile:fullscreen .aspect-spacer { display: none; }
        .video-tile:fullscreen .video-container { position: absolute; inset: 0; }
        .video-tile:fullscreen .video-container video { object-fit: contain; background: #000; }

        /* Free-floating tile */
        .video-tile.floating {
            position: fixed;
            z-index: 100;
            transition: none;
            box-shadow: 0 8px 32px rgba(0,0,0,.3);
        }
        .video-tile.floating .aspect-spacer { display: none; }
        .video-tile.floating .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .video-tile.dragging { opacity: 0.8; cursor: grabbing; }

        /* Resize handle */
        .video-tile .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: nwse-resize;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .video-tile:hover .resize-handle,
        .video-tile.floating .resize-handle { opacity: 0.7; }
        .resize-handle::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            border-right: 2px solid rgba(255,255,255,0.7);
            border-bottom: 2px solid rgba(255,255,255,0.7);
        }

        /* Reset button for floating tiles */
        .video-tile .reset-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #fff;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 14px;
            line-height: 1;
        }
        .video-tile.floating .reset-btn { display: flex; }

        /* ═══════════════════════════════════════
           CASE 2 & 3: Presentation mode
           (1 or 2 screen shares active)
           ═══════════════════════════════════════ */
        .live-content.presentation-mode {
            flex-direction: column;
            overflow: hidden;
        }

        /* Screenshare area: dominant */
        .presentation-mode #screenshareGrid {
            flex: 4;
            min-height: 0;
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 8px;
        }
        .presentation-mode #screenshareGrid .video-tile {
            flex: 1 1 0;
        }
        .presentation-mode #screenshareGrid .video-tile .aspect-spacer { display: none; }
        .presentation-mode #screenshareGrid .video-tile .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Camera strip: secondary, max 20% */
        .presentation-mode #cameraGrid {
            display: flex;
            flex: 0 1 20%;
            max-height: 20%;
            min-height: 40px;
            gap: 6px;
            justify-content: center;
            align-items: stretch;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .presentation-mode #cameraGrid .video-tile {
            flex: 0 0 auto;
            height: 100%;
            aspect-ratio: 16 / 9;
            width: auto;
        }

        /* 2 shares: even more dominant (85/15 split) */
        .live-content.shares-2 #screenshareGrid { flex: 5; }
        .live-content.shares-2 #cameraGrid {
            flex: 0 1 15%;
            max-height: 15%;
            min-height: 36px;
        }

        /* Single camera in presentation: compact pip-style */
        .presentation-mode.camera-1 #cameraGrid {
            flex: 0 0 auto;
            max-height: 12%;
        }

        @media (max-width: 640px) {
            .presentation-mode #cameraGrid {
                min-height: 50px;
                gap: 4px;
            }
            .presentation-mode #cameraGrid .video-tile {
                flex: 0 0 100px;
                max-width: 100px;
            }
        }

        /* ── Chat: floating draggable panel ── */
        #chatBtn { position: relative; }
        #chatBtn.active, #chatBtn[data-active="true"] {
            background: var(--accentSoft);
            border-color: var(--accent);
            color: var(--accent);
        }
        .chat-unread-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border: 2px solid var(--card);
            border-radius: 50%;
        }
        .chat-unread-dot.hidden { display: none; }

        .message-channel {
            position: fixed;
            width: 360px;
            height: 500px;
            right: 40px;
            bottom: 120px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.22);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            resize: both;
            overflow: hidden;
            min-width: 280px;
            min-height: 320px;
            max-width: 100vw;
            max-height: 100dvh;
        }
        .message-channel.hidden { display: none; }

        .channel-header {
            padding: 12px 16px;
            background: var(--soft);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            flex-shrink: 0;
        }
        .channel-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .channel-title svg { width: 16px; height: 16px; stroke: var(--accent); }
        .close-channel-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .close-channel-btn svg { width: 16px; height: 16px; }
        .close-channel-btn:hover { background: var(--border); color: var(--text); }

        .channel-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 13px;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .chat-message p { margin: 0; }
        .chat-message .msg-author {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 2px;
            opacity: 0.75;
        }
        .user-message {
            background: var(--accent);
            color: #fff;
            align-self: flex-end;
        }
        .partner-message {
            background: var(--soft);
            border: 1px solid var(--border);
            color: var(--text);
            align-self: flex-start;
        }
        .system-message {
            background: var(--accentSoft);
            color: var(--muted);
            align-self: center;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 999px;
        }
        .chat-message a { color: inherit; text-decoration: underline; word-break: break-all; }

        .chat-input-container {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--soft);
            color: var(--text);
            font-size: 14px;
            font-family: var(--sans);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,164,0.15);
        }
        .send-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, opacity 0.15s;
        }
        .send-btn svg { width: 18px; height: 18px; }
        .send-btn:hover:not(:disabled) { background: var(--accentHover); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Mobile: full-screen, not draggable/resizable */
        @media (max-width: 640px) {
            .message-channel {
                inset: 0 !important;
                width: 100% !important;
                height: 100dvh !important;
                right: auto;
                bottom: auto;
                border: none;
                border-radius: 0;
                resize: none;
                max-width: none;
                max-height: none;
            }
            .channel-header { cursor: default; padding: 14px 16px; }
            .channel-messages { padding: 12px 14px; }
            .chat-input-container { padding: 12px 14px; }
            .chat-input { font-size: 16px; padding: 12px 14px; } /* 16px prevents iOS zoom */
            .send-btn { width: 44px; height: 44px; }
            .close-channel-btn { width: 32px; height: 32px; }
            .close-channel-btn svg { width: 20px; height: 20px; }
            .chat-message { font-size: 14px; max-width: 90%; }
        }

        /* Toast Notifications */
        #toastContainer {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            pointer-events: auto;
            animation: toastIn 0.3s ease-out;
            max-width: 360px;
            text-align: center;
        }
        .toast.error { border-color: var(--dangerBorder); color: var(--dangerText); }
        .toast .toast-hint { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
        .toast .toast-actions { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
        .toast .toast-btn {
            font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--soft); color: var(--text);
            cursor: pointer;
        }
        .toast .toast-btn:hover { border-color: var(--accent); }
        .toast .toast-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .toast.fade-out { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

        /* Persistent alert (non-retriable errors) */
        .toast.persistent { border-color: var(--dangerBorder); color: var(--dangerText); }

        /* Network status banners */
        #networkBanner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10001;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: opacity 0.3s;
        }
        #networkBanner.offline {
            display: block;
            background: var(--dangerBorder);
            color: #fff;
        }
        #networkBanner.reconnecting {
            display: block;
            background: var(--accentBorder);
            color: var(--text);
        }
        #networkBanner.fade-out {
            opacity: 0;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
        }
    </style>
</head>
<body>

<!-- Toast Container -->
<div id="toastContainer"></div>

<!-- Network Status Banner -->
<div id="networkBanner"></div>

<!-- Theme Toggle -->
<button id="themeToggle" title="Toggle theme">
    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<!-- Topbar -->
<div class="topbar" id="topbar">
    <div class="topbar-left">TinyRoom</div>
    <div class="topbar-right">
        <span class="room-code-pill" id="topbarRoomCode"></span>
        <button class="topbar-btn" id="copyCodeBtn" title="Copy room code">
            Code
            <span class="copied-tooltip" id="copyCodeTooltip">Copied!</span>
        </button>
        <button class="topbar-btn" id="copyLinkBtn" title="Copy invite link">
            Link
            <span class="copied-tooltip" id="copyLinkTooltip">Copied!</span>
        </button>
        <button class="topbar-btn" id="resetLayoutBtn" title="Reset layout">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Reset
        </button>
    </div>
</div>

<!-- Entry Screen -->
<div id="entryScreen">
    <div class="entry-inner">
        <div class="entry-hero">
            <h1>TinyRoom<span class="beta-pill">Beta</span></h1>
            <p>Start a call in seconds</p>
        </div>
        <input type="text" class="entry-input" id="nameInput" placeholder="Your name" maxlength="24" autofocus>
        <div class="name-hint" id="nameHint">Please enter your name first</div>
        <div class="entry-cta">
            <button class="btn btn-primary btn-full" id="startBtn">Start call</button>
        </div>
        <div class="or-divider">or</div>
        <div class="join-row">
            <input type="text" class="entry-input" id="codeInput" placeholder="Room code">
            <button class="btn btn-secondary" id="joinBtn">Join</button>
        </div>
        <div class="name-hint" id="codeHint">Please enter a room code</div>
        <div class="entry-footer">Up to 8 people &middot; Simple video chat</div>
    </div>
</div>

<!-- Live Screen: the Jitsi meeting UI fills this area -->
<style>
    #jitsiContainer { flex: 1; min-height: 0; display: flex; }
    #jitsiContainer iframe { border: 0; width: 100%; height: 100%; }
</style>
<div id="liveScreen">
    <div id="jitsiContainer"></div>
</div>

<script src="https://meet.jit.si/external_api.js"></script>
<script>
(function () {
    'use strict';

    // ── DOM refs ──
    const $ = (id) => document.getElementById(id);
    const entryScreen = $('entryScreen');
    const liveScreen = $('liveScreen');
    const topbar = $('topbar');
    const nameInput = $('nameInput');
    const codeInput = $('codeInput');
    const nameHint = $('nameHint');
    const startBtn = $('startBtn');
    const joinBtn = $('joinBtn');
    const topbarRoomCode = $('topbarRoomCode');
    const jitsiContainer = $('jitsiContainer');

    // Jitsi lays out its own tiles; the reset-layout button has no job now.
    $('resetLayoutBtn').style.display = 'none';

    // ── Jitsi ──
    // Public jitsi.org server. Room codes are short, so the real Jitsi room
    // name is namespaced to keep collisions with strangers unlikely.
    const JITSI_DOMAIN = 'meet.jit.si';
    const ROOM_PREFIX = 'TinyWinsRoom2-';

    let api = null;          // JitsiMeetExternalAPI instance while in a room
    let roomCode = '';
    let nameHintTimer = null;
    let codeHintTimer = null;

    // ── Toast Notifications ──
    const activeToasts = new Set();

    function showToast(message, opts = {}) {
        const { type = 'info', duration = 4000, hint, action, onAction } = opts;

        // Deduplicate — don't show the same message twice
        if (activeToasts.has(message)) return;
        activeToasts.add(message);

        const container = $('toastContainer');

        // Max 1 error toast at a time — clear previous
        if (type === 'error') {
            container.querySelectorAll('.toast.error').forEach(t => {
                activeToasts.delete(t.dataset.msg);
                t.remove();
            });
        }

        const toast = document.createElement('div');
        toast.className = `toast${type === 'error' ? ' error' : ''}`;
        toast.dataset.msg = message;

        let html = `<span>${message}</span>`;
        if (hint) html += `<span class="toast-hint">${hint}</span>`;
        if (action && onAction) {
            html += `<div class="toast-actions"><button class="toast-btn primary">${action}</button><button class="toast-btn dismiss-btn">Dismiss</button></div>`;
        } else if (action) {
            html += `<div class="toast-actions"><button class="toast-btn dismiss-btn">${action}</button></div>`;
        }
        toast.innerHTML = html;

        function removeToast() {
            activeToasts.delete(message);
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 300);
        }

        if (action && onAction) {
            toast.querySelector('.toast-btn.primary').addEventListener('click', () => { removeToast(); onAction(); });
        }
        const dismissBtn = toast.querySelector('.dismiss-btn');
        if (dismissBtn) dismissBtn.addEventListener('click', removeToast);

        container.appendChild(toast);
        if (!action) setTimeout(removeToast, duration);
    }

    // ── Theme ──
    function initTheme() {
        const saved = localStorage.getItem('tinyroom-theme');
        if (saved) {
            setTheme(saved);
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            setTheme('light');
        }
    }

    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('tinyroom-theme', theme);
        const sunIcon = document.querySelector('#themeToggle .sun-icon');
        const moonIcon = document.querySelector('#themeToggle .moon-icon');
        if (theme === 'dark') {
            sunIcon.style.display = 'block';
            moonIcon.style.display = 'none';
        } else {
            sunIcon.style.display = 'none';
            moonIcon.style.display = 'block';
        }
    }

    $('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
    });

    initTheme();

    // ── Name Validation ──
    nameInput.addEventListener('input', () => {
        nameHint.classList.remove('visible');
        if (nameHintTimer) { clearTimeout(nameHintTimer); nameHintTimer = null; }
    });

    function validateName() {
        if (!nameInput.value.trim()) {
            nameHint.classList.add('visible');
            nameInput.focus();
            if (nameHintTimer) clearTimeout(nameHintTimer);
            nameHintTimer = setTimeout(() => nameHint.classList.remove('visible'), 3000);
            return false;
        }
        return true;
    }

    // ── URL Deep Linking ──
    // Vanity slug map: room2.tinywins.space/SLUG → code lookup. Path stays in the URL.
    const SLUGS = {
        'vibelive': 'QNFSZN'
    };
    const pathSlug = window.location.pathname.replace(/^\/+|\/+$/g, '');
    const urlParams = new URLSearchParams(window.location.search);
    const urlCode = urlParams.get('code') || SLUGS[pathSlug] || null;
    if (urlCode) codeInput.value = urlCode;

    // ── Dynamic Button Priority ──
    codeInput.addEventListener('input', () => {
        updateButtonPriority();
        $('codeHint').classList.remove('visible');
        if (codeHintTimer) { clearTimeout(codeHintTimer); codeHintTimer = null; }
    });

    function updateButtonPriority() {
        const hasCode = codeInput.value.trim() !== '';
        if (hasCode) {
            joinBtn.className = 'btn btn-primary';
            startBtn.className = 'btn btn-secondary btn-full btn-blocked';
            // Prevent accidentally creating a new room when invitee has a code
            startBtn.disabled = true;
            startBtn.title = 'Clear the room code to start a new room';
        } else {
            startBtn.className = 'btn btn-primary btn-full';
            joinBtn.className = 'btn btn-secondary';
            startBtn.disabled = false;
            startBtn.title = '';
        }
    }
    updateButtonPriority();

    // ── Room Codes ──
    // No ambiguous characters (0/O, 1/I): easy to read aloud.
    function generateCode() {
        const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const rand = new Uint32Array(6);
        crypto.getRandomValues(rand);
        let code = '';
        for (let i = 0; i < 6; i++) code += alphabet[rand[i] % alphabet.length];
        return code;
    }

    // ── Enter / Leave ──
    function enterRoom(code, displayName) {
        roomCode = code.toUpperCase();

        entryScreen.style.display = 'none';
        liveScreen.style.display = 'flex';
        topbar.style.display = 'flex';
        topbarRoomCode.textContent = roomCode;

        // Keep the code in the URL so refresh rejoins the same room.
        const url = new URL(window.location.href);
        url.searchParams.set('code', roomCode);
        history.replaceState(null, '', url.toString());

        api = new JitsiMeetExternalAPI(JITSI_DOMAIN, {
            roomName: ROOM_PREFIX + roomCode,
            parentNode: jitsiContainer,
            userInfo: { displayName: displayName },
            configOverwrite: {
                // Our entry screen already collected the name; skip Jitsi's prejoin.
                prejoinConfig: { enabled: false },
                // Stay in the browser on mobile instead of pushing the native app.
                disableDeepLinking: true,
                subject: 'TinyRoom ' + roomCode,
            },
            interfaceConfigOverwrite: {
                MOBILE_APP_PROMO: false,
            },
        });

        // Fired after the user hangs up inside the Jitsi UI.
        api.addListener('readyToClose', leaveRoom);
    }

    function leaveRoom() {
        if (api) { api.dispose(); api = null; }
        jitsiContainer.innerHTML = '';
        liveScreen.style.display = 'none';
        topbar.style.display = 'none';
        entryScreen.style.display = 'flex';
        startBtn.disabled = false;
        startBtn.textContent = 'Start call';
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join';
        updateButtonPriority();
    }

    // ── Copy Helpers ──
    function flashTooltip(tooltipEl) {
        tooltipEl.classList.add('show');
        setTimeout(() => tooltipEl.classList.remove('show'), 1500);
    }

    $('copyCodeBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(roomCode || '');
        flashTooltip($('copyCodeTooltip'));
    });

    $('copyLinkBtn').addEventListener('click', () => {
        const url = new URL(window.location.origin + '/');
        url.searchParams.set('code', roomCode || '');
        navigator.clipboard.writeText(url.toString());
        flashTooltip($('copyLinkTooltip'));
    });

    // ── Entry Actions ──
    startBtn.addEventListener('click', () => {
        if (!validateName()) return;
        enterRoom(generateCode(), nameInput.value.trim());
    });

    joinBtn.addEventListener('click', () => {
        if (!validateName()) return;
        const code = codeInput.value.trim();
        if (!code) {
            $('codeHint').classList.add('visible');
            codeInput.focus();
            if (codeHintTimer) clearTimeout(codeHintTimer);
            codeHintTimer = setTimeout(() => $('codeHint').classList.remove('visible'), 3000);
            return;
        }
        enterRoom(code, nameInput.value.trim());
    });

    // Enter key: sensible default per field.
    nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') (codeInput.value.trim() ? joinBtn : startBtn).click();
    });
    codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') joinBtn.click();
    });
})();
</script>
</body>
</html>
