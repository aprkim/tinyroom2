    // ── Chat: floating draggable message channel ──
    const messageChannel = $('messageChannel');
    const channelHeader = $('channelHeader');
    const channelMessages = $('channelMessages');
    const channelInput = $('channelInput');
    const chatForm = $('chatForm');
    const sendChannelBtn = $('sendChannelMessage');
    const chatBtn = $('chatBtn');
    const chatUnreadDot = $('chatUnreadDot');
    let chatMessageIds = new Set();   // dedupe by pid
    let systemMsgShown = false;

    function isChatHidden() { return messageChannel.classList.contains('hidden'); }

    // Turn URLs into safe clickable links — DOM nodes only, never innerHTML (XSS-safe)
    function appendLinkified(el, text) {
        const urlRe = /(https?:\/\/[^\s]+)/g;
        let lastIndex = 0, match;
        while ((match = urlRe.exec(text)) !== null) {
            if (match.index > lastIndex)
                el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
            const a = document.createElement('a');
            a.href = match[0];
            a.textContent = match[0];
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            el.appendChild(a);
            lastIndex = match.index + match[0].length;
        }
        if (lastIndex < text.length)
            el.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    // Render a message bubble. type: 'user' | 'partner' | 'system'
    function addChannelMessage(text, type, author) {
        const el = document.createElement('div');
        el.className = `chat-message ${type}-message`;
        if (type === 'partner' && author) {
            const a = document.createElement('span');
            a.className = 'msg-author';
            a.textContent = author;
            el.appendChild(a);
        }
        const p = document.createElement('p');
        appendLinkified(p, text);
        el.appendChild(p);
        channelMessages.appendChild(el);
        channelMessages.scrollTop = channelMessages.scrollHeight;
    }

    function getMyUserId() {
        return VibeLive.user?.pid || VibeLive.user?.id || null;
    }

    // For history: include isSelf check (history contains your own past messages)
    function appendHistoryMessage(msg) {
        if (!msg || !msg.pid || chatMessageIds.has(msg.pid)) return;
        chatMessageIds.add(msg.pid);
        const myId = getMyUserId();
        const isSelf = myId && msg.owner_id === myId;
        if (isSelf) {
            addChannelMessage(msg.content, 'user');
        } else {
            const author = msg.sender_display_name || msg.owner_username || 'Someone';
            addChannelMessage(msg.content, 'partner', author);
        }
    }

    // For real-time: SDK guarantees this only fires for OTHERS' messages
    // — so we don't need isSelf detection, just dedup
    function appendIncomingMessage(msg) {
        if (!msg || (msg.pid && chatMessageIds.has(msg.pid))) return;
        if (msg.pid) chatMessageIds.add(msg.pid);
        const author = msg.sender_display_name || msg.owner_username || 'Someone';
        addChannelMessage(msg.content, 'partner', author);
        if (isChatHidden()) chatUnreadDot.classList.remove('hidden');
    }

    function clearChat() {
        channelMessages.innerHTML = '';
        chatMessageIds.clear();
        systemMsgShown = false;
        chatUnreadDot.classList.add('hidden');
    }

    async function loadChatHistory() {
        if (typeof VibeLive.getMessages !== 'function') {
            console.warn('VibeLive.getMessages not available — chat disabled');
            chatBtn.style.display = 'none';
            return;
        }
        const channelId = VibeLive.channel?.id;
        if (!channelId) return;
        if (!systemMsgShown) {
            addChannelMessage('Chat started', 'system');
            systemMsgShown = true;
        }
        try {
            const messages = await VibeLive.getMessages(channelId, { count: 50 });
            // API returns newest-first → render oldest-first
            [...(messages || [])].reverse().forEach(appendHistoryMessage);
        } catch (e) {
            console.error('Chat history load failed:', e);
            // Don't break the join flow — chat just won't have history
        }
    }

    function openChat() {
        messageChannel.classList.remove('hidden');
        chatBtn.dataset.active = 'true';
        chatUnreadDot.classList.add('hidden');
        if (window.matchMedia('(max-width: 640px)').matches === false) {
            setTimeout(() => channelInput.focus(), 100);
        }
    }

    function closeChat() {
        messageChannel.classList.add('hidden');
        chatBtn.dataset.active = 'false';
    }

    chatBtn.addEventListener('click', () => isChatHidden() ? openChat() : closeChat());
    $('closeChannelBtn').addEventListener('click', closeChat);

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = channelInput.value.trim();
        if (!text) return;
        const channelId = VibeLive.channel?.id;
        if (!channelId) return;

        channelInput.value = '';
        sendChannelBtn.disabled = true;
        try {
            const created = await VibeLive.sendMessage(channelId, text);
            // sendMessage doesn't echo back — render our own message locally
            if (created && created.pid) chatMessageIds.add(created.pid);
            addChannelMessage(text, 'user');
        } catch (err) {
            console.error('sendMessage failed:', err);
            addChannelMessage(text, 'user'); // still show locally so the user isn't lost
            showToast('Message may not have sent. Please check your connection.', { type: 'error' });
        } finally {
            sendChannelBtn.disabled = false;
            channelInput.focus();
        }
    });

    // Drag the panel by its header (desktop only — mobile is full-screen)
    function makeDraggable(element, handle) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        handle.addEventListener('mousedown', (e) => {
            if (window.matchMedia('(max-width: 640px)').matches) return; // no drag on mobile
            if (e.target.closest('.close-channel-btn')) return;
            e.preventDefault();
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (ev) => {
                ev.preventDefault();
                pos1 = pos3 - ev.clientX; pos2 = pos4 - ev.clientY;
                pos3 = ev.clientX; pos4 = ev.clientY;
                element.style.top = (element.offsetTop - pos2) + 'px';
                element.style.left = (element.offsetLeft - pos1) + 'px';
                element.style.right = 'auto';
                element.style.bottom = 'auto';
            };
        });
    }
    makeDraggable(messageChannel, channelHeader);

    // Real-time incoming messages — register inside channelSelected (after auth)
    let chatRealtimeRegistered = false;
    function registerChatRealtime() {
        if (chatRealtimeRegistered) return;
        if (typeof VibeLive.setOnMessage !== 'function') return;
        try {
            VibeLive.setOnMessage((msg) => {
                const channelId = VibeLive.channel?.id;
                if (!channelId) return;
                // Ignore channel messages not for this channel
                if (msg.target_type === 'channel' && msg.target_id !== channelId) return;
                appendIncomingMessage(msg);
            });
            chatRealtimeRegistered = true;
        } catch (e) {
            console.warn('setOnMessage failed:', e);
        }
    }

    // Esc to close chat
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !isChatHidden()) closeChat();
    });

    // ════════════════════════════════════════════
    // ── VibeLive Events ──
    // ════════════════════════════════════════════

    // REQUIRED: channelSelected -- set up local tiles, show controls
    VibeLive.on('channelSelected', async (channel) => {
        topbarRoomCode.textContent = VibeLive.roomCode;
        showScreen('preLive');

        // Element-First Rule: create both camera and screenshare tiles
        const members = await VibeLive.getMembers();

        // Participant limit check
        const activeMembers = members.filter(m => m.displayStatus !== 'EXITED');
        const maxParticipants = isMobile ? MOBILE_MAX_PARTICIPANTS : DESKTOP_MAX_PARTICIPANTS;
        if (activeMembers.length > maxParticipants) {
            if (isMobile) {
                $('mobileFullOverlay').classList.add('visible');
                tearDown();
            } else {
                showAlert(`This room is full (max ${maxParticipants} participants).`);
                tearDown();
            }
            return;
        }

        const self = members.find(m => m.id === VibeLive.memberId);
        const selfName = self?.displayName || localName || 'You';

        createTile(VibeLive.memberId, selfName, 'camera', true);
        createTile(VibeLive.memberId, selfName, 'screenshare', true);
        // Read state explicitly to catch any memberStateChange that fired before tiles existed
        const localState = VibeLive.getMemberState(VibeLive.memberId);
        if (localState) updateTileFromState(VibeLive.memberId, localState);

        // Move local camera tile to preview area for pre-live
        const localCamTile = document.getElementById(`tile-${VibeLive.memberId}-camera`);
        if (localCamTile) {
            previewContainer.appendChild(localCamTile);
        }

        // Start camera + mic for preview
        await VibeLive.setVideo(true);
        await VibeLive.setAudio(true);
        updatePreLiveControls();

        // Load chat history + register real-time handler (non-blocking, errors swallowed)
        try { registerChatRealtime(); } catch (e) { console.error('registerChatRealtime threw:', e); }
        try { loadChatHistory(); } catch (e) { console.error('loadChatHistory threw:', e); }
    });

    // REQUIRED: memberStateChange -- unified state for ALL members
    VibeLive.on('memberStateChange', (memberId, state) => {
        // state = { status, live, video, audio, screenVideo }
        updateTileFromState(memberId, state);

        // Update control buttons if local
        if (memberId === VibeLive.memberId) {
            updatePreLiveControls();
            updateLiveControls();
        }
    });

    // REQUIRED: remoteStreamStart -- create remote tile via registerTile()
    VibeLive.on('remoteStreamStart', (memberId, streamType) => {
        const tileId = `tile-${memberId}-${streamType}`;
        const isNewTile = !document.getElementById(tileId);
        const m = VibeLive.getMember(memberId);
        createTile(memberId, m?.displayName || 'Remote', streamType, false);
        // Only read state on FIRST creation — duplicate stream_start events
        // (which the SDK sometimes fires on SFU re-announcement) would otherwise
        // re-toggle the screenshare tile's display and cause a visible flash.
        if (isNewTile) {
            const state = VibeLive.getMemberState(memberId);
            if (state) updateTileFromState(memberId, state);
        }
        // Beep only when the first remote participant joins this session (camera stream)
        if (streamType === 'camera' && !participantJoinedOnce) {
            participantJoinedOnce = true;
            playParticipantJoinedTone();
        }
    });

    // RECOMMENDED: localJoined -- transition to live screen

    // RECOMMENDED: remoteJoined -- tile creation deferred to remoteStreamStart

    VibeLive.on('remoteJoined', (memberId) => {
        // No tile created here — wait until they go live (remoteStreamStart)
    });

    // RECOMMENDED: kicked -- show message, exitRoom, return to entry
    VibeLive.on('kicked', (message) => {
        if (kickHandled) return;
        kickHandled = true;
        tearDown(); // Full cleanup including floating tiles

    // ── Network Status Banner ──
    const networkBanner = $('networkBanner');

    function showNetworkBanner(type, text) {
        networkBanner.className = type; // 'offline' or 'reconnecting'
        networkBanner.textContent = text;
        networkBanner.classList.remove('fade-out');
    }

    function hideNetworkBanner() {
        networkBanner.classList.add('fade-out');
        setTimeout(() => { networkBanner.className = ''; networkBanner.textContent = ''; }, 300);
    }

    // Auto-retry on coming back online
    window.addEventListener('online', () => {
        hideNetworkBanner();
        showToast('Back online.', { type: 'info', duration: 2000 });
    });

    window.addEventListener('offline', () => {
        showNetworkBanner('offline', 'You\'re offline. Check your internet connection.');
    });

    // REQUIRED: error — per Error Guide v1.0
    VibeLive.on('error', (context, error) => {
        const { code, message, hint, retriable } = error || {};

        // Dev bugs — log only, never show to users
        if (code && (code.startsWith('INIT_') || code.startsWith('STATE_') || code === 'INVALID_PARAM')) {
            console.error(`[DEV BUG] [${context}] ${code}: ${message}`);
            return;
        }

        // User cancelled screenshare — silent, not an error
        if (code === 'SCREENSHARE_CANCELLED') return;

        // Always log full debug info to console
        console.warn(`[VibeLive] [${context}] ${code}: ${message}`, hint);

        // Kicked — primary handler is on('kicked'); dedupe here
        if (code === 'ROOM_KICKED') {
            if (kickHandled) return;
            kickHandled = true;
            tearDown();
            showKickedModal('You were removed from this room.');
            return;
        }

        // Room closed/disabled — redirect to entry
        if (code === 'ROOM_CLOSED' || code === 'ROOM_DISABLED') {
            tearDown();
            showKickedModal(getUserMessage(error));
            return;
        }

        // Room full — show waiting message with retry
        if (code === 'ROOM_FULL') {
            showToast(getUserMessage(error), {
                type: 'error',
                action: 'Retry',
                onAction: () => {
                    const roomCode = codeInput.value.trim();
                    if (roomCode) VibeLive.enterByRoomCode(roomCode);
                }
            });
            return;
        }

        // Project unavailable — service-level issue, redirect to entry
        if (code === 'PROJECT_UNAVAILABLE') {
            tearDown();
            showKickedModal(getUserMessage(error));
            return;
        }

        // Account-level capacity reached — show retry
        if (code === 'ACCOUNT_LIMIT_REACHED') {
            showToast(getUserMessage(error), {
                type: 'error',
                action: 'Retry',
                onAction: () => {
                    const roomCode = codeInput.value.trim();
                    if (roomCode) VibeLive.enterByRoomCode(roomCode);
                }
            });
            return;
        }

        // Permission denied — show guidance
        if (code === 'MEDIA_PERMISSION_DENIED') {
            showAlert('Camera/mic access was blocked. Please allow access in your browser settings and reload the page.');
            return;
        }

        // Device busy — show retry
        if (code === 'MEDIA_DEVICE_BUSY') {
            showToast('Your camera is being used by another app. Close it and try again.', {
                type: 'error',
                action: 'Retry',
                onAction: () => { VibeLive.setVideo(true); }
            });
            return;
        }

        // WebSocket disconnected — subtle reconnecting indicator
        if (code === 'NETWORK_WS_DISCONNECTED') {
            showNetworkBanner('reconnecting', 'Connection lost. Reconnecting...');
            return;
        }

        // Offline
        if (code === 'NETWORK_OFFLINE') {
            showNetworkBanner('offline', 'You\'re offline. Check your internet connection.');
            return;
        }

        const userMsg = getUserMessage(error);

        // Retriable — show toast with retry
        if (retriable) {
            showToast(userMsg, { type: 'error', action: 'Retry', onAction: () => {
                console.log(`Retrying ${context}...`);
            }});
            return;
        }

        // Non-retriable — show auto-dismiss alert
        showAlert(userMsg);
    });

    // RECOMMENDED: warning
    VibeLive.on('warning', (context, message) => {
        console.warn(`[VibeLive ${context}]`, message);
    });

    // remoteStreamEnd / remoteLeft: SDK auto-removes registered tiles,
    // but floating tiles (on document.body) need manual cleanup
    VibeLive.on('remoteLeft', (memberId) => {
        document.querySelectorAll(`.video-tile.floating[data-member-id="${memberId}"]`).forEach(t => t.remove());
        updateGridLayout();
    });

    // Screenshare ended (member stays) — clean up floating screenshare tile only
    VibeLive.on('remoteStreamEnd', (memberId, streamType) => {
        document.querySelectorAll(`.video-tile.floating[data-member-id="${memberId}"][data-stream-type="${streamType}"]`).forEach(t => t.remove());
        updateGridLayout();
    });

})();
</script>
</body>
</html>
