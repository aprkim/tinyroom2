<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>TinyRoom - Video Chat</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --radius: 12px;
            --max: 980px;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;

            --bg: #f7f9f8;
            --card: #ffffff;
            --soft: #f0f4f3;
            --border: #e2e8f0;
            --borderSoft: #dbe2ea;

            --text: #1e293b;
            --muted: #64748b;
            --muted2: #9CA3AF;

            --accent: #0EA5A4;
            --accentHover: #0d9488;
            --accentSoft: rgba(14,165,164,.10);
            --accentBorder: rgba(14,165,164,.35);

            --liveBg: #E8F4ED;
            --liveBorder: #A6C5A3;
            --liveText: #324252;

            --disabledBg: #F3F4F6;
            --disabledBorder: #E5E7EB;
            --disabledText: #6B7280;

            --dangerBg: #FEF2F2;
            --dangerBorder: #fca5a5;
            --dangerText: #b91c1c;

            --overlay: rgba(30, 41, 59, 0.5);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card: #111827;
            --soft: #1f2937;
            --border: #273244;
            --borderSoft: #334155;

            --text: #e5e7eb;
            --muted: #9ca3af;
            --muted2: #6b7280;

            --accent: #0EA5A4;
            --accentHover: #14b8a6;
            --accentSoft: rgba(14,165,164,.18);
            --accentBorder: rgba(14,165,164,.45);

            --liveBg: rgba(16,185,129,.15);
            --liveBorder: rgba(16,185,129,.4);
            --liveText: #a7f3d0;

            --dangerBg: rgba(239,68,68,.15);
            --dangerBorder: rgba(239,68,68,.4);
            --dangerText: #fca5a5;

            --overlay: rgba(0,0,0,0.6);
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            height: 100vh; /* fallback for older browsers */
            display: flex;
            flex-direction: column;
            transition: background 0.2s, color 0.2s;
            overflow: hidden;
        }
        @supports (height: 100dvh) {
            body { height: 100dvh; }
        }

        /* Theme Toggle */
        #themeToggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }
        #themeToggle:hover { border-color: var(--accent); }
        #themeToggle svg { width: 18px; height: 18px; }

        /* Topbar */
        .topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .topbar.visible { display: flex; }
        .topbar-left { font-weight: 700; font-size: 15px; color: var(--accent); }
        .topbar-right { display: flex; align-items: center; gap: 8px; }
        .room-code-pill {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accentSoft);
            border: 1px solid var(--accentBorder);
            padding: 4px 10px;
            border-radius: 8px;
        }
        .topbar-btn {
            background: var(--soft);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s;
        }
        .topbar-btn:hover { border-color: var(--accent); color: var(--text); }
        .copied-tooltip {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .copied-tooltip.show { opacity: 1; }

        /* Entry Screen */
        #entryScreen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            gap: 0;
            overflow-y: auto;
        }
        .entry-inner {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .entry-hero {
            text-align: center;
            margin-bottom: 32px;
        }
        .entry-hero h1 {
            font-size: 36px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .entry-hero p {
            font-size: 15px;
            color: var(--muted);
        }
        .beta-pill {
            display: inline-block;
            vertical-align: top;
            background: rgba(14, 165, 164, 0.15);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 8px;
            position: relative;
            top: 4px;
            border: 1px solid rgba(14, 165, 164, 0.25);
        }
        .entry-input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 16px;
            font-family: var(--sans);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        [data-theme="light"] .entry-input {
            border-color: rgba(0,0,0,0.22);
            background: rgba(0,0,0,0.02);
        }
        .entry-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,164,0.15);
        }
        .entry-input::placeholder { color: var(--muted2); }
        .entry-input:-webkit-autofill,
        .entry-input:-webkit-autofill:hover,
        .entry-input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
            -webkit-text-fill-color: var(--text);
            transition: background-color 5000s ease-in-out 0s;
        }

        .name-hint {
            font-size: 12px;
            color: var(--dangerText);
            margin-top: 6px;
            padding-left: 18px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 16px;
            text-align: left;
            width: 100%;
        }
        .name-hint.visible { opacity: 1; }

        .entry-cta {
            width: 100%;
            margin-top: 20px;
        }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--muted2);
            font-size: 11px;
            width: 100%;
            opacity: 0.35;
            text-transform: lowercase;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--muted2);
        }

        .join-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .join-row .entry-input { flex: 1; }

        .entry-footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--muted2);
            opacity: 0.65;
            text-align: center;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
            font-family: var(--sans);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:active:not(:disabled) { transform: scale(0.98); }
        .btn-primary {
            padding: 14px 24px;
            font-weight: 700;
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 12px rgba(14,165,164,0.25);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--accentHover);
            box-shadow: 0 4px 16px rgba(14,165,164,0.35);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.04);
            color: var(--text);
            border-color: rgba(255,255,255,0.15);
        }
        [data-theme="light"] .btn-secondary {
            background: rgba(0,0,0,0.02);
            border-color: rgba(0,0,0,0.22);
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.08);
            border-color: var(--accent);
        }
        [data-theme="light"] .btn-secondary:hover:not(:disabled) {
            background: rgba(0,0,0,0.04);
        }
        .btn-danger {
            background: var(--dangerBg);
            color: var(--dangerText);
            border-color: var(--dangerBorder);
        }
        .btn-danger:hover { background: var(--dangerBorder); color: #fff; }

        .btn:disabled { cursor: not-allowed; }
        /* Dim only when explicitly marked as "blocked" (not during loading spinner) */
        .btn.btn-blocked:disabled { opacity: 0.45; }
        .btn-full { width: 100%; }
        .join-row .btn { flex: 0 0 auto; min-width: 80px; padding: 14px 20px; }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Pre-Live Screen */
        #preLiveScreen {
            display: none;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .prelive-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: stretch;
            gap: 16px;
            width: 100%;
            max-width: var(--max);
            margin: 0 auto;
        }
        .preview-container {
            width: min(70%, calc((100vh - 180px) * 16 / 9 * 0.7));
            max-width: 100%;
        }
        .prelive-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .prelive-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Live Screen */
        #liveScreen {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }
        .live-content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
            overflow: hidden;
            width: 100%;
        }

        /* ═══════════════════════════════════════
           CASE 1: No screen share — CSS Grid
           ═══════════════════════════════════════ */
        #screenshareGrid {
            display: none;
        }
        #screenshareGrid.has-shares {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            width: 100%;
        }
        #screenshareGrid .video-tile {
            flex: 1 1 0;
            min-width: 0;
        }

        #cameraGrid {
            display: grid;
            gap: 8px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }
        /* 1 participant: single centered tile */
        .camera-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; place-items: center; }
        .camera-1 .video-tile { width: 100%; max-width: min(100%, calc((100vh - 160px) * 16 / 9)); }
        /* 2 participants: side by side */
        .camera-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
        /* 3 participants: top 2, bottom center */
        .camera-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .camera-3 .video-tile:nth-child(3) { grid-column: 1 / -1; max-width: 50%; justify-self: center; }
        /* 4 participants: 2×2 */
        .camera-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        /* 5 participants: top 3, bottom 2 centered */
        .camera-5 { grid-template-columns: repeat(6, 1fr); grid-template-rows: 1fr 1fr; }
        .camera-5 .video-tile:nth-child(1) { grid-column: 1 / 3; }
        .camera-5 .video-tile:nth-child(2) { grid-column: 3 / 5; }
        .camera-5 .video-tile:nth-child(3) { grid-column: 5 / 7; }
        .camera-5 .video-tile:nth-child(4) { grid-column: 2 / 4; }
        .camera-5 .video-tile:nth-child(5) { grid-column: 4 / 6; }
        /* 6 participants: 3×2 */
        .camera-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
        /* 7 participants: top 4, bottom 3 centered */
        .camera-7 { grid-template-columns: repeat(8, 1fr); grid-template-rows: 1fr 1fr; }
        .camera-7 .video-tile:nth-child(1) { grid-column: 1 / 3; }
        .camera-7 .video-tile:nth-child(2) { grid-column: 3 / 5; }
        .camera-7 .video-tile:nth-child(3) { grid-column: 5 / 7; }
        .camera-7 .video-tile:nth-child(4) { grid-column: 7 / 9; }
        .camera-7 .video-tile:nth-child(5) { grid-column: 1 / 3; }
        .camera-7 .video-tile:nth-child(6) { grid-column: 3 / 6; }
        .camera-7 .video-tile:nth-child(7) { grid-column: 6 / 9; }
        /* 8 participants: 4×2 */
        .camera-8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }

        /* Video Tile */
        .video-tile {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--soft);
            border: 1px solid var(--border);
            transition: transform 0.3s, opacity 0.3s;
        }
        .video-tile[data-is-local="true"] { border: 2px solid var(--accentBorder); }

        .video-tile .aspect-spacer {
            display: block;
            padding-top: 56.25%;
        }

        .video-container {
            position: absolute;
            inset: 0;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .video-container video.visible { display: block; }
        .video-tile[data-is-local="true"][data-stream-type="camera"] .video-container video {
            transform: scaleX(-1);
        }
        /* Screenshare: contain to show full screen, letterbox with dark bg */
        .video-tile[data-stream-type="screenshare"] .video-container video {
            object-fit: contain;
            background: #000;
        }
        .video-container video::-webkit-media-controls { display: none !important; }
        .video-container video::-webkit-media-controls-enclosure { display: none !important; }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--soft);
            color: var(--muted);
        }
        .video-placeholder.hidden { display: none !important; }
        .video-placeholder .initials {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accentSoft);
            border: 2px solid var(--accentBorder);
            color: var(--accent);
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .member-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(transparent, rgba(0,0,0,.5));
        }
        .member-name {
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,.4);
        }
        .member-indicators {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-badge {
            display: none;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--liveBg);
            color: var(--liveText);
            border: 1px solid var(--liveBorder);
        }
        .status-badge.active { display: inline-block; }

        .indicator {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .indicator svg { width: 14px; height: 14px; }
        .indicator.on {
            background: rgba(14,165,164,.7);
            color: #fff;
        }
        .indicator.off {
            background: rgba(185,28,28,.7);
            color: #fff;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .ctrl-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }
        .ctrl-btn:hover { border-color: var(--accent); }
        .ctrl-btn.active { background: var(--accentSoft); border-color: var(--accent); color: var(--accent); }
        .ctrl-btn.off { background: var(--dangerBg); border-color: var(--dangerBorder); color: var(--dangerText); }
        .ctrl-btn.off:hover { background: var(--dangerBorder); color: #fff; }
        .ctrl-btn.danger {
            background: var(--dangerBg);
            border-color: var(--dangerBorder);
            color: var(--dangerText);
            margin-left: 16px;
        }
        .ctrl-btn.danger:hover { background: var(--dangerBorder); color: #fff; }
        .ctrl-btn svg { width: 20px; height: 20px; }

        /* Grid tiles fill their cell */
        #cameraGrid .video-tile {
            width: 100%;
            height: 100%;
        }
        #cameraGrid .video-tile .aspect-spacer { display: none; }
        #cameraGrid .video-tile .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Kicked / Session-ended Modal */
        #kickedOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #kickedOverlay.visible { display: flex; }
        #mobileFullOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        #mobileFullOverlay.visible { display: flex; }
        .kicked-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 32px 28px 24px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        .kicked-card .btn {
            padding: 10px 32px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: none;
        }
        [data-theme="light"] .kicked-card {
            border-color: rgba(0,0,0,0.08);
        }
        .kicked-card h3 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
        }
        .kicked-card p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 24px;
            white-space: pre-line;
        }

        /* Mobile */
        @media (max-width: 640px) {
            /* Topbar compact — single row, no wrap */
            .topbar { padding: 6px 10px; }
            .topbar-left { font-size: 12px; }
            .topbar-right { gap: 4px; }
            .room-code-pill { font-size: 10px; padding: 2px 6px; }
            .topbar-btn { font-size: 10px; padding: 2px 6px; white-space: nowrap; }

            /* Entry screen */
            #entryScreen { padding: 20px 16px; }
            .entry-hero h1 { font-size: 28px; }
            .entry-input { font-size: 16px; } /* prevent iOS zoom on focus */
            .preview-container { width: 95% !important; }

            /* Pre-live controls: wrap if needed */
            .prelive-controls { flex-wrap: wrap; gap: 8px; }
            .prelive-actions { flex-wrap: wrap; gap: 8px; }

            /* Live screen: ensure topbar and controls stay visible */
            #liveScreen { max-height: 100vh; }
            .live-content { padding: 6px; gap: 4px; }

            /* Camera grid on mobile */
            #cameraGrid { gap: 4px; }
            .camera-1 { grid-template-columns: 1fr; }
            /* 2 participants: stack vertically on mobile */
            .camera-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
            /* 3 participants: stack vertically */
            .camera-3 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
            .camera-3 .video-tile:nth-child(3) { grid-column: auto; max-width: 100%; justify-self: auto; }
            .camera-4 { grid-template-columns: 1fr 1fr; }
            .camera-5 { grid-template-columns: repeat(2, 1fr); }
            .camera-5 .video-tile:nth-child(1) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(2) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(3) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(4) { grid-column: auto; }
            .camera-5 .video-tile:nth-child(5) { grid-column: 1 / -1; max-width: 50%; justify-self: center; }
            .camera-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
            .camera-7 { grid-template-columns: repeat(2, 1fr); }
            .camera-7 .video-tile { grid-column: auto !important; }
            .camera-7 .video-tile:nth-child(7) { grid-column: 1 / -1 !important; max-width: 50%; justify-self: center; }
            .camera-8 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); }

            /* Screenshare grid */
            #screenshareGrid.has-shares { flex-wrap: wrap; gap: 4px; }
            #screenshareGrid .video-tile { flex: 1 1 100%; }

            /* Smaller tiles: smaller initials */
            .video-placeholder .initials { width: 40px; height: 40px; font-size: 16px; }
            .member-info { padding: 4px 6px; }
            .member-name { font-size: 10px; }
            .status-badge { font-size: 8px; padding: 1px 4px; }
            .indicator { width: 20px; height: 20px; }
            .indicator svg { width: 11px; height: 11px; }

            /* Hide screen share on mobile */
            .hide-on-mobile { display: none !important; }

            /* Controls bar: touch-friendly but compact */
            .ctrl-btn { width: 44px; height: 44px; min-width: 44px; }
            .ctrl-btn svg { width: 18px; height: 18px; }
            .ctrl-btn.danger { margin-left: 8px; }
            .controls-bar { gap: 6px; padding: 8px 12px; flex-wrap: nowrap; }

            /* Video tiles: smaller radius */
            .video-tile { border-radius: 12px; }

            /* Floating tile buttons: bigger touch targets on mobile */
            .video-tile .spotlight-btn { opacity: 0.7; width: 32px; height: 32px; top: 4px; right: 4px; }
            .video-tile .reset-btn { width: 32px; height: 32px; top: 4px; left: 4px; font-size: 16px; }

            /* Toast notifications: fit within 375px screens */
            #toastContainer { max-width: calc(100vw - 32px); }
            .toast { max-width: calc(100vw - 40px); }

            /* Network banner: ensure readability on narrow screens */
            #networkBanner { padding: 6px 12px; font-size: 11px; }

            /* Kicked modal: ensure padding on small screens */
            .kicked-card { padding: 20px 16px 16px; }
        }

        /* Landscape mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            .topbar { padding: 4px 12px; }
            .topbar-left { font-size: 12px; }

            .live-content { padding: 4px; gap: 4px; }
            #cameraGrid { gap: 3px; }

            /* Landscape: prefer wide grids */
            .camera-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
            .camera-3 .video-tile:nth-child(3) { grid-column: auto; max-width: none; }
            .camera-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
            .camera-5, .camera-6 { grid-template-columns: repeat(3, 1fr); }
            .camera-5 .video-tile { grid-column: auto !important; }
            .camera-7, .camera-8 { grid-template-columns: repeat(4, 1fr); }
            .camera-7 .video-tile { grid-column: auto !important; }

            .controls-bar { padding: 4px 12px; }
            .ctrl-btn { width: 36px; height: 36px; border-radius: 8px; }
            .ctrl-btn svg { width: 18px; height: 18px; }

            .member-info { padding: 2px 4px; }
            .member-name { font-size: 9px; }
            .video-placeholder .initials { width: 28px; height: 28px; font-size: 12px; }

            .presentation-mode #cameraGrid .video-tile {
                flex: 0 0 90px;
                max-width: 90px;
            }
        }

        /* Spotlight/Fullscreen Mode */
        .video-tile .spotlight-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 5;
        }
        .video-tile:hover .spotlight-btn { opacity: 1; }
        @media (pointer: coarse) { .video-tile .spotlight-btn { opacity: 0.7; } }
        .spotlight-btn svg { width: 16px; height: 16px; }

        /* CSS fallback spotlight */
        .video-tile.spotlighted {
            position: fixed;
            inset: 0;
            z-index: 999;
            border-radius: 0;
            border: none;
            width: 100% !important;
            max-width: none !important;
        }
        .video-tile.spotlighted .aspect-spacer { display: none; }
        .video-tile.spotlighted .video-container { position: absolute; inset: 0; }
        .video-tile.spotlighted .video-container video { object-fit: contain; background: #000; }

        /* Native fullscreen */
        .video-tile:fullscreen {
            border-radius: 0;
            border: none;
            width: 100%;
            height: 100%;
            background: #000;
        }
        .video-tile:fullscreen .aspect-spacer { display: none; }
        .video-tile:fullscreen .video-container { position: absolute; inset: 0; }
        .video-tile:fullscreen .video-container video { object-fit: contain; background: #000; }

        /* Free-floating tile */
        .video-tile.floating {
            position: fixed;
            z-index: 100;
            transition: none;
            box-shadow: 0 8px 32px rgba(0,0,0,.3);
        }
        .video-tile.floating .aspect-spacer { display: none; }
        .video-tile.floating .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .video-tile.dragging { opacity: 0.8; cursor: grabbing; }

        /* Resize handle */
        .video-tile .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            cursor: nwse-resize;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .video-tile:hover .resize-handle,
        .video-tile.floating .resize-handle { opacity: 0.7; }
        .resize-handle::after {
            content: '';
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            border-right: 2px solid rgba(255,255,255,0.7);
            border-bottom: 2px solid rgba(255,255,255,0.7);
        }

        /* Reset button for floating tiles */
        .video-tile .reset-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #fff;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
            font-size: 14px;
            line-height: 1;
        }
        .video-tile.floating .reset-btn { display: flex; }

        /* ═══════════════════════════════════════
           CASE 2 & 3: Presentation mode
           (1 or 2 screen shares active)
           ═══════════════════════════════════════ */
        .live-content.presentation-mode {
            flex-direction: column;
            overflow: hidden;
        }

        /* Screenshare area: dominant */
        .presentation-mode #screenshareGrid {
            flex: 4;
            min-height: 0;
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 8px;
        }
        .presentation-mode #screenshareGrid .video-tile {
            flex: 1 1 0;
        }
        .presentation-mode #screenshareGrid .video-tile .aspect-spacer { display: none; }
        .presentation-mode #screenshareGrid .video-tile .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Camera strip: secondary, max 20% */
        .presentation-mode #cameraGrid {
            display: flex;
            flex: 0 1 20%;
            max-height: 20%;
            min-height: 40px;
            gap: 6px;
            justify-content: center;
            align-items: stretch;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .presentation-mode #cameraGrid .video-tile {
            flex: 0 0 auto;
            height: 100%;
            aspect-ratio: 16 / 9;
            width: auto;
        }

        /* 2 shares: even more dominant (85/15 split) */
        .live-content.shares-2 #screenshareGrid { flex: 5; }
        .live-content.shares-2 #cameraGrid {
            flex: 0 1 15%;
            max-height: 15%;
            min-height: 36px;
        }

        /* Single camera in presentation: compact pip-style */
        .presentation-mode.camera-1 #cameraGrid {
            flex: 0 0 auto;
            max-height: 12%;
        }

        @media (max-width: 640px) {
            .presentation-mode #cameraGrid {
                min-height: 50px;
                gap: 4px;
            }
            .presentation-mode #cameraGrid .video-tile {
                flex: 0 0 100px;
                max-width: 100px;
            }
        }

        /* ── Chat: floating draggable panel ── */
        #chatBtn { position: relative; }
        #chatBtn.active, #chatBtn[data-active="true"] {
            background: var(--accentSoft);
            border-color: var(--accent);
            color: var(--accent);
        }
        .chat-unread-dot {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border: 2px solid var(--card);
            border-radius: 50%;
        }
        .chat-unread-dot.hidden { display: none; }

        .message-channel {
            position: fixed;
            width: 360px;
            height: 500px;
            right: 40px;
            bottom: 120px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.22);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            resize: both;
            overflow: hidden;
            min-width: 280px;
            min-height: 320px;
            max-width: 100vw;
            max-height: 100dvh;
        }
        .message-channel.hidden { display: none; }

        .channel-header {
            padding: 12px 16px;
            background: var(--soft);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            flex-shrink: 0;
        }
        .channel-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .channel-title svg { width: 16px; height: 16px; stroke: var(--accent); }
        .close-channel-btn {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }
        .close-channel-btn svg { width: 16px; height: 16px; }
        .close-channel-btn:hover { background: var(--border); color: var(--text); }

        .channel-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 13px;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .chat-message p { margin: 0; }
        .chat-message .msg-author {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 2px;
            opacity: 0.75;
        }
        .user-message {
            background: var(--accent);
            color: #fff;
            align-self: flex-end;
        }
        .partner-message {
            background: var(--soft);
            border: 1px solid var(--border);
            color: var(--text);
            align-self: flex-start;
        }
        .system-message {
            background: var(--accentSoft);
            color: var(--muted);
            align-self: center;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 999px;
        }
        .chat-message a { color: inherit; text-decoration: underline; word-break: break-all; }

        .chat-input-container {
            padding: 12px 14px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--soft);
            color: var(--text);
            font-size: 14px;
            font-family: var(--sans);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(14,165,164,0.15);
        }
        .send-btn {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, opacity 0.15s;
        }
        .send-btn svg { width: 18px; height: 18px; }
        .send-btn:hover:not(:disabled) { background: var(--accentHover); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Mobile: full-screen, not draggable/resizable */
        @media (max-width: 640px) {
            .message-channel {
                inset: 0 !important;
                width: 100% !important;
                height: 100dvh !important;
                right: auto;
                bottom: auto;
                border: none;
                border-radius: 0;
                resize: none;
                max-width: none;
                max-height: none;
            }
            .channel-header { cursor: default; padding: 14px 16px; }
            .channel-messages { padding: 12px 14px; }
            .chat-input-container { padding: 12px 14px; }
            .chat-input { font-size: 16px; padding: 12px 14px; } /* 16px prevents iOS zoom */
            .send-btn { width: 44px; height: 44px; }
            .close-channel-btn { width: 32px; height: 32px; }
            .close-channel-btn svg { width: 20px; height: 20px; }
            .chat-message { font-size: 14px; max-width: 90%; }
        }

        /* Toast Notifications */
        #toastContainer {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
            pointer-events: auto;
            animation: toastIn 0.3s ease-out;
            max-width: 360px;
            text-align: center;
        }
        .toast.error { border-color: var(--dangerBorder); color: var(--dangerText); }
        .toast .toast-hint { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
        .toast .toast-actions { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
        .toast .toast-btn {
            font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--soft); color: var(--text);
            cursor: pointer;
        }
        .toast .toast-btn:hover { border-color: var(--accent); }
        .toast .toast-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .toast.fade-out { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }

        /* Persistent alert (non-retriable errors) */
        .toast.persistent { border-color: var(--dangerBorder); color: var(--dangerText); }

        /* Network status banners */
        #networkBanner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10001;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            transition: opacity 0.3s;
        }
        #networkBanner.offline {
            display: block;
            background: var(--dangerBorder);
            color: #fff;
        }
        #networkBanner.reconnecting {
            display: block;
            background: var(--accentBorder);
            color: var(--text);
        }
        #networkBanner.fade-out {
            opacity: 0;
        }

        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
        }
    </style>
</head>
<body>

<!-- Toast Container -->
<div id="toastContainer"></div>

<!-- Network Status Banner -->
<div id="networkBanner"></div>

<!-- Theme Toggle -->

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.0/dist/livekit-client.umd.min.js"></script>
<script>
(function () {
    'use strict';

    // ── LiveKit Cloud ──
    // Development token server (LiveKit-hosted, dev/test only): mints join
    // tokens so this static page needs no backend. For production, mint tokens
    // in a Cloud Function instead.

    // ── Chimes ── (Web Audio; silently no-ops where audio isn't available)
    function playTwoTone(freq1, freq2, vol, gapS) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const play = () => {
                const t = ctx.currentTime;
                const gain1 = ctx.createGain();
                gain1.connect(ctx.destination);
                gain1.gain.setValueAtTime(vol, t);
                gain1.gain.exponentialRampToValueAtTime(0.01, t + gapS + 0.05);
                const osc1 = ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.value = freq1;
                osc1.connect(gain1);
                osc1.start(t);
                osc1.stop(t + gapS);

                const gain2 = ctx.createGain();
                gain2.connect(ctx.destination);
                gain2.gain.setValueAtTime(vol, t + gapS);
                gain2.gain.exponentialRampToValueAtTime(0.01, t + gapS + 0.35);
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = freq2;
                osc2.connect(gain2);
                osc2.start(t + gapS);
                osc2.stop(t + gapS + 0.3);

                setTimeout(() => ctx.close(), 800);
            };
            // Resume first — Safari and some Chrome versions start suspended.
            if (ctx.state === 'suspended') ctx.resume().then(play); else play();
        } catch (e) { /* audio unavailable */ }
    }
    // Ascending: someone joined. Descending: someone left / call ended.
    function playParticipantJoinedTone() { playTwoTone(440, 660, 0.25, 0.15); }
    function playParticipantLeftTone()   { playTwoTone(480, 360, 0.3, 0.2); }

    // ── Toast Notifications ──
    const activeToasts = new Set();

    function showToast(message, opts = {}) {
        const { type = 'info', duration = 4000, hint, action, onAction } = opts;
        if (activeToasts.has(message)) return;
        activeToasts.add(message);

        const container = $('toastContainer');
        if (type === 'error') {
            container.querySelectorAll('.toast.error').forEach(t => {
                activeToasts.delete(t.dataset.msg);
                t.remove();
            });
        }

        const toast = document.createElement('div');
        toast.className = `toast${type === 'error' ? ' error' : ''}`;
        toast.dataset.msg = message;

        let html = `<span>${message}</span>`;
        if (hint) html += `<span class="toast-hint">${hint}</span>`;
        if (action && onAction) {
            html += `<div class="toast-actions"><button class="toast-btn primary">${action}</button><button class="toast-btn dismiss-btn">Dismiss</button></div>`;
        } else if (action) {
            html += `<div class="toast-actions"><button class="toast-btn dismiss-btn">${action}</button></div>`;
        }
        toast.innerHTML = html;

        function removeToast() {
            activeToasts.delete(message);
            toast.classList.add('fade-out');
            setTimeout(() => toast.remove(), 300);
        }

        if (action && onAction) {
            toast.querySelector('.toast-btn.primary').addEventListener('click', () => { removeToast(); onAction(); });
        }
        const dismissBtn = toast.querySelector('.dismiss-btn');
        if (dismissBtn) dismissBtn.addEventListener('click', removeToast);

        container.appendChild(toast);
        if (!action) setTimeout(removeToast, duration);
    }

        localStorage.setItem('tinyroom-theme', theme);
        const sunIcon = document.querySelector('#themeToggle .sun-icon');
        const moonIcon = document.querySelector('#themeToggle .moon-icon');
        if (theme === 'dark') {
            sunIcon.style.display = 'block';

            moonIcon.style.display = 'block';

    // ── Room Codes ── (no ambiguous characters: easy to read aloud)
    function generateCode() {
        const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const rand = new Uint32Array(6);
        crypto.getRandomValues(rand);
        let code = '';
        for (let i = 0; i < 6; i++) code += alphabet[rand[i] % alphabet.length];
        return code;
    }

    // ── Helpers ──
    function getInitials(name) {
        if (!name || !name.trim()) return '?';
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0][0].toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function isLocalIdentity(identity) {
        return !!(room && room.localParticipant.identity === identity);
    }

    function displayName(identity) {
        if (!room) return identity;
        if (room.localParticipant.identity === identity) return localName;
        const p = room.remoteParticipants.get(identity);
        return (p && (p.name || p.identity)) || identity;
    }

    // ── Spotlight (fullscreen) ──
    async function toggleSpotlight(tile) {
        const btn = tile.querySelector('.spotlight-btn');
        if (document.fullscreenElement) {
            await document.exitFullscreen();
        } else {
            try {
                await tile.requestFullscreen();
            } catch (e) {
                // Fallback to CSS fullscreen if the API isn't available
                tile.classList.add('spotlighted');
                if (btn) btn.innerHTML = ICONS_SHRINK;
                document.body.appendChild(tile);
            }
        }
    }

    document.addEventListener('fullscreenchange', () => {
        document.querySelectorAll('.spotlight-btn').forEach(btn => {

    // ── Free Move & Resize ──
    function resetTile(tile) {
        tile.classList.remove('floating', 'spotlighted');
        tile.style.left = '';
        tile.style.top = '';
        tile.style.width = '';
        tile.style.height = '';
        const grid = tile.dataset.streamType === 'screenshare' ? screenshareGrid : cameraGrid;
        if (!grid.contains(tile)) grid.appendChild(tile);
        updateGridLayout();
    }

    function makeFloating(tile, x, y, w, h) {
        tile.classList.add('floating');
        tile.style.left = x + 'px';
        tile.style.top = y + 'px';
        tile.style.width = w + 'px';
        tile.style.height = h + 'px';
        document.body.appendChild(tile);   // above everything
    }

    function enableDrag(tile) {
        let startX, startY, startLeft, startTop, dragging = false, downRect = null;

        function onDown(cx, cy) {
            // Record the start only — the tile floats once a real drag begins.
            startX = cx;
            startY = cy;
            downRect = tile.getBoundingClientRect();
            startLeft = tile.classList.contains('floating') ? parseFloat(tile.style.left) : downRect.left;
            startTop  = tile.classList.contains('floating') ? parseFloat(tile.style.top)  : downRect.top;
            dragging = false;
        }

        function onMove(cx, cy) {
            const dx = cx - startX;
            const dy = cy - startY;
            if (!dragging) {
                if (Math.abs(dx) <= 3 && Math.abs(dy) <= 3) return;
                dragging = true;
                if (!tile.classList.contains('floating')) {
                    makeFloating(tile, downRect.left, downRect.top, downRect.width, downRect.height);
                    startLeft = downRect.left;
                    startTop = downRect.top;
                }
                tile.classList.add('dragging');
            }
            tile.style.left = (startLeft + dx) + 'px';
            tile.style.top = (startTop + dy) + 'px';
        }

        function onUp() { tile.classList.remove('dragging'); }

        tile.addEventListener('mousedown', (e) => {
            if (e.target.closest('.resize-handle') || e.target.closest('.spotlight-btn') || e.target.closest('.reset-btn')) return;
            e.preventDefault();
            onDown(e.clientX, e.clientY);
            function mm(e) { onMove(e.clientX, e.clientY); }
            function mu() { onUp(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
            document.addEventListener('mousemove', mm);
            document.addEventListener('mouseup', mu);
        });

        tile.addEventListener('touchstart', (e) => {
            if (e.target.closest('.resize-handle') || e.target.closest('.spotlight-btn') || e.target.closest('.reset-btn')) return;
            const t = e.touches[0];
            onDown(t.clientX, t.clientY);
            function tm(e) { const t = e.touches[0]; onMove(t.clientX, t.clientY); }
            function te() { onUp(); document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); }
            document.addEventListener('touchmove', tm, { passive: true });
            document.addEventListener('touchend', te);
        }, { passive: true });
    }

    function enableResize(tile) {
        const handle = document.createElement('div');
        handle.className = 'resize-handle';
        tile.appendChild(handle);

        // Snap-back button (visible only while floating)
        const resetBtn = document.createElement('button');
        resetBtn.className = 'reset-btn';
        resetBtn.title = 'Snap back to grid';
        resetBtn.innerHTML = '×';
        resetBtn.addEventListener('click', (e) => { e.stopPropagation(); resetTile(tile); });
        tile.appendChild(resetBtn);

        let startX, startY, startW, startH;

        function onDown(cx, cy) {
            const rect = tile.getBoundingClientRect();
            startX = cx; startY = cy; startW = rect.width; startH = rect.height;
            if (!tile.classList.contains('floating')) makeFloating(tile, rect.left, rect.top, rect.width, rect.height);
        }

        function onMove(cx, cy) {
            tile.style.width = Math.max(100, startW + (cx - startX)) + 'px';
            tile.style.height = Math.max(70, startH + (cy - startY)) + 'px';
        }

        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            onDown(e.clientX, e.clientY);
            function mm(e) { onMove(e.clientX, e.clientY); }
            function mu() { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
            document.addEventListener('mousemove', mm);
            document.addEventListener('mouseup', mu);
        });

        handle.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            const t = e.touches[0];
            onDown(t.clientX, t.clientY);
            function tm(e) { const t = e.touches[0]; onMove(t.clientX, t.clientY); }
            function te() { document.removeEventListener('touchmove', tm); document.removeEventListener('touchend', te); }
            document.addEventListener('touchmove', tm, { passive: true });
            document.addEventListener('touchend', te);
        }, { passive: false });
    }

    $('resetLayoutBtn').addEventListener('click', () => {
        document.querySelectorAll('.video-tile.floating, .video-tile.spotlighted').forEach(resetTile);
    });

    // ── Grid Layout / Presentation Mode ──
    function updateGridLayout() {
        const count = cameraGrid.querySelectorAll('.video-tile:not([style*="display: none"])').length;
        const cls = Math.min(count, 8);
        cameraGrid.className = cameraGrid.className.replace(/camera-\d+/g, '').trim();
        liveContent.className = liveContent.className.replace(/camera-\d+/g, '').trim();
        if (cls > 0) {
            cameraGrid.classList.add(`camera-${cls}`);
            liveContent.classList.add(`camera-${cls}`);
        }
        updatePresentationMode();
    }

    function updatePresentationMode() {
        const shareCount = screenshareGrid.querySelectorAll('.video-tile:not([style*="display: none"])').length;
        screenshareGrid.classList.toggle('has-shares', shareCount > 0);
        liveContent.classList.toggle('presentation-mode', shareCount > 0);
        liveContent.classList.toggle('shares-1', shareCount === 1);
        liveContent.classList.toggle('shares-2', shareCount >= 2);
    }

    // ── Tiles ──
    // Same structure as the original TinyRoom UI (the CSS is unchanged).
    function tileId(identity, streamType) { return `tile-${identity}-${streamType}`; }

    function createTile(identity, name, streamType, isLocal) {
        const existing = document.getElementById(tileId(identity, streamType));
        if (existing) return existing;

        const tile = document.createElement('div');
        tile.className = 'video-tile';
        tile.id = tileId(identity, streamType);
        tile.dataset.memberId = identity;
        tile.dataset.streamType = streamType;
        tile.dataset.isLocal = isLocal ? 'true' : 'false';

        const spotlightBtn = document.createElement('button');
        spotlightBtn.className = 'spotlight-btn';
        spotlightBtn.title = 'Toggle fullscreen';
        spotlightBtn.innerHTML = ICONS_EXPAND;
        spotlightBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleSpotlight(tile); });
        tile.appendChild(spotlightBtn);

        const spacer = document.createElement('div');
        spacer.className = 'aspect-spacer';
        tile.appendChild(spacer);

        const videoContainer = document.createElement('div');
        videoContainer.className = 'video-container';

        const placeholder = document.createElement('div');
        placeholder.className = 'video-placeholder';
        if (streamType === 'camera') {
            const initialsEl = document.createElement('div');
            initialsEl.className = 'initials';
            initialsEl.textContent = getInitials(name);
            placeholder.appendChild(initialsEl);
        } else {
            const span = document.createElement('span');
            span.textContent = isLocal ? 'Your Screen' : `${name}'s Screen`;
            placeholder.appendChild(span);
        }

        // LiveKit attaches its MediaStream to this element (track.attach(video)).
        const video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        video.muted = true;   // audio arrives via separate hidden <audio> elements

        videoContainer.appendChild(placeholder);
        videoContainer.appendChild(video);
        tile.appendChild(videoContainer);

        // Info bar: name + LIVE badge + cam/mic indicators
        const memberInfo = document.createElement('div');
        memberInfo.className = 'member-info';
        const label = streamType === 'screenshare'
            ? (isLocal ? 'Your Screen' : `${name}'s Screen`)
            : (isLocal ? `${name} (You)` : name);
        const nameEl = document.createElement('span');
        nameEl.className = 'member-name';
        nameEl.textContent = label;
        memberInfo.appendChild(nameEl);
        const indicators = document.createElement('div');
        indicators.className = 'member-indicators';
        indicators.innerHTML = streamType === 'camera'
            ? `<span class="status-badge active">LIVE</span>
               <span class="indicator cam-video off" title="Camera">${ICONS.camOff}</span>
               <span class="indicator cam-audio off" title="Microphone">${ICONS.micOff}</span>`
            : `<span class="status-badge active">LIVE</span>`;
        memberInfo.appendChild(indicators);
        tile.appendChild(memberInfo);

        (streamType === 'screenshare' ? screenshareGrid : cameraGrid).appendChild(tile);
        enableDrag(tile);
        enableResize(tile);
        updateGridLayout();
        return tile;
    }

    function removeTile(identity, streamType) {
        const tile = document.getElementById(tileId(identity, streamType));
        if (tile) {
            if (document.fullscreenElement === tile) document.exitFullscreen().catch(() => {});
            tile.remove();
        }
        updateGridLayout();
    }

    function setIndicator(tile, which, on) {
        const ind = tile.querySelector(`.indicator.${which}`);
        if (!ind) return;
        ind.className = `indicator ${which} ${on ? 'on' : 'off'}`;
        ind.innerHTML = which === 'cam-video' ? (on ? ICONS.camOn : ICONS.camOff) : (on ? ICONS.micOn : ICONS.micOff);
    }

    function showTileVideo(tile, on) {
        const video = tile.querySelector('video');
        const ph = tile.querySelector('.video-placeholder');
        if (video) video.classList.toggle('visible', on);
        if (ph) ph.classList.toggle('hidden', on);
        if (tile.dataset.streamType === 'camera') setIndicator(tile, 'cam-video', on);
    }

    function attachVideo(identity, streamType, track) {
        const tile = createTile(identity, displayName(identity), streamType, isLocalIdentity(identity));
        track.attach(tile.querySelector('video'));
        showTileVideo(tile, true);
    }

    function detachVideo(identity, streamType, track) {
        const tile = document.getElementById(tileId(identity, streamType));
        if (!tile) return;
        const video = tile.querySelector('video');
        if (track && video) track.detach(video);
        showTileVideo(tile, false);
    }

    function setMicIndicator(identity, on) {
        const tile = document.getElementById(tileId(identity, 'camera'));
        if (tile) setIndicator(tile, 'cam-audio', on);
    }

    // ── Development token server ──
    async function fetchConnectionDetails(lkRoomName, participantName) {
        if (!LIVEKIT_SANDBOX_ID || LIVEKIT_SANDBOX_ID.startsWith('__')) throw new Error('NO_SANDBOX');
        const source = LK.TokenSource.developmentTokenServer(LIVEKIT_SANDBOX_ID);
        return source.fetch({ roomName: lkRoomName, participantName: participantName });
        // → { serverUrl, participantToken, ... }
    }

    // ── Enter / Leave ──
    async function enterRoom(code, name) {
        roomCode = code.toUpperCase();
        localName = name;

        let details;
        try {
            details = await fetchConnectionDetails(ROOM_PREFIX + roomCode, name);
        } catch (e) {
            console.error('Token error:', e);
            showToast(e.message === 'NO_SANDBOX'
                ? 'LiveKit is not configured yet — add the token server ID.'
                : 'Could not reach the call service. Please try again.', { type: 'error' });
            resetEntryButtons();
            return;
        }

        room = new LK.Room({ adaptiveStream: true, dynacast: true });
        wireRoomEvents(room);

        try {
            await room.connect(details.serverUrl, details.participantToken);
        } catch (e) {
            console.error('Connect error:', e);
            showToast('Could not join the room. Please try again.', { type: 'error' });
            room = null;
            resetEntryButtons();
            return;
        }

        entryScreen.style.display = 'none';
        liveScreen.style.display = 'flex';
        topbar.style.display = 'flex';
        topbarRoomCode.textContent = roomCode;

        // Keep the code in the URL so refresh rejoins the same room.
        const url = new URL(window.location.href);
        url.searchParams.set('code', roomCode);
        history.replaceState(null, '', url.toString());

        clearChat();
        addChannelMessage('Chat started', 'system');

        // Local tile first so you always see yourself immediately.
        createTile(room.localParticipant.identity, localName, 'camera', true);
        room.remoteParticipants.forEach(p => {
            createTile(p.identity, p.name || p.identity, 'camera', false);
            const mic = p.getTrackPublication(LK.Track.Source.Microphone);
            setMicIndicator(p.identity, !!(mic && !mic.isMuted));
        });

        try {
            await room.localParticipant.enableCameraAndMicrophone();
        } catch (e) {
            console.error('Media error:', e);
            showToast('Camera/mic access was blocked. Allow access in your browser settings.', { type: 'error', action: 'OK' });
        }
        syncControlButtons();
    }

    function leaveRoom() {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        if (room) { room.disconnect(); room = null; playParticipantLeftTone(); }   // call ended
        document.querySelectorAll('.video-tile').forEach(t => t.remove());   // grids + floating
        audioEls.forEach(els => els.forEach(el => el.remove()));
        audioEls.clear();
        updateGridLayout();
        closeChat();
        clearChat();
        liveScreen.style.display = 'none';
        topbar.style.display = 'none';
        entryScreen.style.display = 'flex';
        resetEntryButtons();
    }

    function resetEntryButtons() {
        startBtn.disabled = false;
        startBtn.textContent = 'Start call';
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join';
        updateButtonPriority();
    }

    // ── Room events → tiles ──
    function wireRoomEvents(r) {
        const E = LK.RoomEvent;
        const S = LK.Track.Source;
        const sourceType = (pub) => pub.source === S.ScreenShare ? 'screenshare' : 'camera';

        r.on(E.ParticipantConnected, (p) => {
            createTile(p.identity, p.name || p.identity, 'camera', false);
            showToast(`${p.name || 'Someone'} joined`, { duration: 2500 });
            playParticipantJoinedTone();
            maybeSendChatHistory(p);
        });

        r.on(E.ParticipantDisconnected, (p) => {
            showToast(`${p.name || 'Someone'} left`, { duration: 2500 });
            playParticipantLeftTone();
            removeTile(p.identity, 'camera');
            removeTile(p.identity, 'screenshare');
            (audioEls.get(p.identity) || []).forEach(el => el.remove());
            audioEls.delete(p.identity);
        });

        r.on(E.TrackSubscribed, (track, pub, p) => {
            if (track.kind === 'video') {
                attachVideo(p.identity, sourceType(pub), track);
                if (pub.isMuted) detachVideo(p.identity, sourceType(pub), null);
            } else if (track.kind === 'audio') {
                const el = track.attach();
                el.style.display = 'none';
                document.body.appendChild(el);
                if (!audioEls.has(p.identity)) audioEls.set(p.identity, []);
                audioEls.get(p.identity).push(el);
                setMicIndicator(p.identity, !pub.isMuted);
            }
        });

        r.on(E.TrackUnsubscribed, (track, pub, p) => {
            if (track.kind === 'video') {
                if (sourceType(pub) === 'screenshare') { track.detach(); removeTile(p.identity, 'screenshare'); }
                else detachVideo(p.identity, 'camera', track);
            } else {
                track.detach().forEach(el => el.remove());
                setMicIndicator(p.identity, false);
            }
        });

        r.on(E.LocalTrackPublished, (pub) => {
            const track = pub.track;
            if (!track) return;
            if (track.kind === 'video') attachVideo(r.localParticipant.identity, sourceType(pub), track);
            else setMicIndicator(r.localParticipant.identity, !pub.isMuted);
            syncControlButtons();
        });

        r.on(E.LocalTrackUnpublished, (pub) => {
            const id = r.localParticipant.identity;
            if (pub.kind === 'video') {
                if (sourceType(pub) === 'screenshare') removeTile(id, 'screenshare');
                else detachVideo(id, 'camera', pub.track);
            } else {
                setMicIndicator(id, false);
            }
            syncControlButtons();
        });

        r.on(E.TrackMuted, (pub, p) => {
            if (pub.kind === 'video' && pub.source === S.Camera) detachVideo(p.identity, 'camera', null);
            if (pub.kind === 'audio') setMicIndicator(p.identity, false);
            if (p === r.localParticipant) syncControlButtons();
        });

        r.on(E.TrackUnmuted, (pub, p) => {
            if (pub.kind === 'video' && pub.source === S.Camera && pub.track) attachVideo(p.identity, 'camera', pub.track);
            if (pub.kind === 'audio') setMicIndicator(p.identity, true);
            if (p === r.localParticipant) syncControlButtons();
        });

        r.on(E.DataReceived, (payload, p, kind, topic) => {
            if (topic !== 'chat') return;
            let msg;
            try { msg = JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return; }
            if (msg.type === 'chat') {
                appendIncomingMessage({ id: msg.id, text: msg.text, author: msg.author || (p && p.name) || 'Someone' });
            } else if (msg.type === 'history' && Array.isArray(msg.messages)) {
                msg.messages.forEach(m => appendIncomingMessage({ id: m.id, text: m.text, author: m.author }, true));
            }
        });

        r.on(E.Disconnected, () => { if (room) leaveRoom(); });
    }

    // ── Controls ──
    function syncControlButtons() {
        if (!room) return;
        const lp = room.localParticipant;
        const camOn = lp.isCameraEnabled;
        const micOn = lp.isMicrophoneEnabled;

        const camBtn = $('liveToggleCam');
        camBtn.innerHTML = camOn ? ICONS.camOn : ICONS.camOff;
        camBtn.classList.toggle('off', !camOn);

        const micBtn = $('liveToggleMic');
        micBtn.innerHTML = micOn ? ICONS.micOn : ICONS.micOff;
        micBtn.classList.toggle('off', !micOn);

        $('liveToggleScreen').classList.toggle('active', lp.isScreenShareEnabled);

        const localTile = document.getElementById(tileId(lp.identity, 'camera'));
        if (localTile) {
            setIndicator(localTile, 'cam-video', camOn);
            setIndicator(localTile, 'cam-audio', micOn);
        }
    }

    $('liveToggleCam').addEventListener('click', async () => {
        if (!room) return;
        try { await room.localParticipant.setCameraEnabled(!room.localParticipant.isCameraEnabled); }
        catch (e) { console.error(e); }
        syncControlButtons();
    });

    $('liveToggleMic').addEventListener('click', async () => {
        if (!room) return;
        try { await room.localParticipant.setMicrophoneEnabled(!room.localParticipant.isMicrophoneEnabled); }
        catch (e) { console.error(e); }
        syncControlButtons();
    });

    $('liveToggleScreen').addEventListener('click', async () => {
        if (!room) return;
        try { await room.localParticipant.setScreenShareEnabled(!room.localParticipant.isScreenShareEnabled); }
        catch (e) { if (e && e.name !== 'NotAllowedError') console.error(e); }   // user cancelled the picker
        syncControlButtons();
    });

    $('leaveBtn').addEventListener('click', leaveRoom);
    window.addEventListener('beforeunload', () => { if (room) room.disconnect(); });

    // ── Chat: floating draggable message channel (LiveKit data channel) ──
    const messageChannel = $('messageChannel');
    const channelHeader = $('channelHeader');
    const channelMessages = $('channelMessages');
    const channelInput = $('channelInput');
    const chatForm = $('chatForm');
    const sendChannelBtn = $('sendChannelMessage');
    const chatBtn = $('chatBtn');
    const chatUnreadDot = $('chatUnreadDot');
    const chatMessageIds = new Set();   // dedupe (history replay can overlap live delivery)
    let chatLog = [];                   // {id, author, text} — replayed to late joiners

    function isChatHidden() { return messageChannel.classList.contains('hidden'); }

    // Turn URLs into safe clickable links — DOM nodes only, never innerHTML (XSS-safe)
    function appendLinkified(el, text) {
        const urlRe = /(https?:\/\/[^\s]+)/g;
        let lastIndex = 0, match;
        while ((match = urlRe.exec(text)) !== null) {
            if (match.index > lastIndex) el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
            const a = document.createElement('a');
            a.href = match[0];
            a.textContent = match[0];
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            el.appendChild(a);
            lastIndex = match.index + match[0].length;
        }
        if (lastIndex < text.length) el.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    // Render a message bubble. type: 'user' | 'partner' | 'system'
    function addChannelMessage(text, type, author) {
        const el = document.createElement('div');
        el.className = `chat-message ${type}-message`;
        if (type === 'partner' && author) {
            const a = document.createElement('span');
            a.className = 'msg-author';
            a.textContent = author;
            el.appendChild(a);
        }
        const p = document.createElement('p');
        appendLinkified(p, text);
        el.appendChild(p);
        channelMessages.appendChild(el);
        channelMessages.scrollTop = channelMessages.scrollHeight;
    }

    function appendIncomingMessage(msg, isHistory) {
        if (!msg || !msg.id || chatMessageIds.has(msg.id)) return;
        chatMessageIds.add(msg.id);
        chatLog.push({ id: msg.id, author: msg.author, text: msg.text });
        addChannelMessage(msg.text, 'partner', msg.author || 'Someone');
        if (!isHistory && isChatHidden()) chatUnreadDot.classList.remove('hidden');
    }

    function clearChat() {
        channelMessages.innerHTML = '';
        chatMessageIds.clear();
        chatLog = [];
        chatUnreadDot.classList.add('hidden');
    }

    function publishChat(obj, opts) {
        if (!room) return Promise.resolve();
        const bytes = new TextEncoder().encode(JSON.stringify(obj));
        return room.localParticipant.publishData(bytes, Object.assign({ reliable: true, topic: 'chat' }, opts || {}));
    }

    // Late joiners get the room's chat so far. Exactly one existing member
    // sends it (lowest identity), so the newcomer doesn't get N copies.
    function maybeSendChatHistory(newcomer) {
        if (!room || !chatLog.length) return;
        const others = [...room.remoteParticipants.keys()].filter(id => id !== newcomer.identity);
        const sender = [room.localParticipant.identity, ...others].sort()[0];
        if (sender !== room.localParticipant.identity) return;
        setTimeout(() => {
            publishChat({ type: 'history', messages: chatLog.slice(-50) }, { destinationIdentities: [newcomer.identity] })
                .catch(e => console.warn('chat history send failed', e));
        }, 600);
    }

    function openChat() {
        messageChannel.classList.remove('hidden');
        chatBtn.dataset.active = 'true';
        chatUnreadDot.classList.add('hidden');
        if (window.matchMedia('(max-width: 640px)').matches === false) setTimeout(() => channelInput.focus(), 100);
    }

    function closeChat() {
        messageChannel.classList.add('hidden');
        chatBtn.dataset.active = 'false';
    }

    chatBtn.addEventListener('click', () => isChatHidden() ? openChat() : closeChat());
    $('closeChannelBtn').addEventListener('click', closeChat);

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = channelInput.value.trim();
        if (!text || !room) return;
        channelInput.value = '';
        sendChannelBtn.disabled = true;
        const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
        try {
            await publishChat({ type: 'chat', id, text, author: localName });
        } catch (err) {
            console.error('chat send failed:', err);
            showToast('Message may not have sent. Please check your connection.', { type: 'error' });
        } finally {
            chatMessageIds.add(id);
            chatLog.push({ id, author: localName, text });
            addChannelMessage(text, 'user');   // data messages aren't echoed back to the sender
            sendChannelBtn.disabled = false;
            channelInput.focus();
        }
    });

    // Drag the panel by its header (desktop only — mobile is full-screen)
    function makeDraggable(element, handle) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        handle.addEventListener('mousedown', (e) => {
            if (window.matchMedia('(max-width: 640px)').matches) return;
            if (e.target.closest('.close-channel-btn')) return;
            e.preventDefault();
            pos3 = e.clientX; pos4 = e.clientY;
            document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
            document.onmousemove = (ev) => {
                ev.preventDefault();
                pos1 = pos3 - ev.clientX; pos2 = pos4 - ev.clientY;
                pos3 = ev.clientX; pos4 = ev.clientY;
                element.style.top = (element.offsetTop - pos2) + 'px';
                element.style.left = (element.offsetLeft - pos1) + 'px';
                element.style.right = 'auto';
                element.style.bottom = 'auto';
            };
        });
    }
    makeDraggable(messageChannel, channelHeader);

    // Esc: close chat, or snap spotlighted tiles back
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (!isChatHidden()) closeChat();
        document.querySelectorAll('.video-tile.spotlighted').forEach(resetTile);
    });

    // ── Copy Helpers ──
    function flashTooltip(tooltipEl) {
        tooltipEl.classList.add('show');
        setTimeout(() => tooltipEl.classList.remove('show'), 1500);
    }

    $('copyCodeBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(roomCode || '');
        flashTooltip($('copyCodeTooltip'));
    });

    $('copyLinkBtn').addEventListener('click', () => {
        const url = new URL(window.location.origin + '/');
        url.searchParams.set('code', roomCode || '');
        navigator.clipboard.writeText(url.toString());
        flashTooltip($('copyLinkTooltip'));
    });

    // ── Entry Actions ──
    startBtn.addEventListener('click', () => {
        if (!validateName()) return;
        startBtn.disabled = true;
        startBtn.innerHTML = '<span class="spinner"></span> Starting...';
        enterRoom(generateCode(), nameInput.value.trim());
    });

    joinBtn.addEventListener('click', () => {
        if (!validateName()) return;
        const code = codeInput.value.trim();
        if (!code) {
            $('codeHint').classList.add('visible');
            codeInput.focus();
            if (codeHintTimer) clearTimeout(codeHintTimer);
            codeHintTimer = setTimeout(() => $('codeHint').classList.remove('visible'), 3000);
            return;
        }
        joinBtn.disabled = true;
        joinBtn.innerHTML = '<span class="spinner"></span> Joining...';
        enterRoom(code, nameInput.value.trim());
    });

    nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') (codeInput.value.trim() ? joinBtn : startBtn).click();
    });
    codeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') joinBtn.click();
    });
})();
</script>
</body>
</html>
